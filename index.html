<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="MR CRM">
<title>Mulk Rehberim CRM</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f5f7fa;--bg2:#fff;--bg3:#eef0f4;--bg4:#e2e6ec;
  --border:#e4e8ef;--border2:#cdd3de;
  --navy:#0d1829;--navy2:#162238;
  --gold:#c47c14;--gold2:#e09020;--gold3:#f5b030;
  --green:#167a38;--green2:#1e9e48;--green3:#d4f0dc;
  --red:#b82020;--red2:#dc3030;--red3:#fde4e4;
  --blue:#1440a0;--blue2:#2060d0;--blue3:#dce8fc;
  --purple:#5020a0;--purple2:#7040c8;--purple3:#ece4fc;
  --orange:#c05010;--orange2:#e07020;--orange3:#feeadc;
  --text:#0d1829;--text2:#3d4e68;--text3:#7a8ea8;--text4:#b8c4d4;
  --sh:0 1px 4px rgba(13,24,41,.07),0 4px 12px rgba(13,24,41,.06);
}
.dark{
  --bg:#0d1117;--bg2:#161b22;--bg3:#21262d;--bg4:#30363d;
  --border:#30363d;--border2:#444c56;
  --navy:#1c2128;--navy2:#2d333b;
  --text:#e6edf3;--text2:#8b949e;--text3:#6e7681;--text4:#484f58;
  --sh:0 1px 4px rgba(0,0,0,.3),0 4px 12px rgba(0,0,0,.2);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg);color:var(--text);font-family:'Plus Jakarta Sans',sans-serif;min-height:100%;-webkit-font-smoothing:antialiased;transition:background .3s,color .3s}
#app{max-width:430px;margin:0 auto;min-height:100dvh;display:flex;flex-direction:column}
.hdr{background:var(--navy);padding:14px 16px 0;position:sticky;top:0;z-index:50;box-shadow:0 2px 16px rgba(0,0,0,.2)}
.hdr-top{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.hdr-logo{width:34px;height:34px;background:linear-gradient(135deg,var(--gold2),var(--gold3));border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:17px;flex-shrink:0}
.hdr-ttl{font-size:15px;font-weight:800;color:#fff;flex:1}
.hdr-sub{font-size:9px;color:rgba(255,255,255,.4);margin-top:1px}
.hdr-btns{display:flex;gap:6px;flex-shrink:0}
.hdr-btn{background:rgba(255,255,255,.1);border:none;border-radius:8px;width:30px;height:30px;color:rgba(255,255,255,.7);font-size:14px;cursor:pointer;-webkit-appearance:none;display:flex;align-items:center;justify-content:center}
.hdr-add{background:linear-gradient(135deg,var(--gold2),var(--gold3));border:none;border-radius:9px;padding:7px 12px;color:var(--navy);font-size:12px;font-weight:700;cursor:pointer;-webkit-appearance:none;white-space:nowrap}
.ntabs{display:flex;overflow-x:auto;scrollbar-width:none}
.ntabs::-webkit-scrollbar{display:none}
.ntab{flex-shrink:0;padding:10px 14px 12px;color:rgba(255,255,255,.4);font-size:11px;font-weight:600;cursor:pointer;border:none;background:none;-webkit-appearance:none;border-bottom:2px solid transparent;white-space:nowrap}
.ntab.on{color:#fff;border-bottom-color:var(--gold3)}
.stats{display:grid;grid-template-columns:repeat(5,1fr);background:var(--bg2);border-bottom:1px solid var(--border)}
.stat{padding:8px 4px;text-align:center;border-right:1px solid var(--border)}
.stat:last-child{border-right:none}
.stat-n{font-family:'DM Mono';font-size:16px;font-weight:500}
.stat-l{font-size:7px;color:var(--text3);text-transform:uppercase;letter-spacing:.3px;margin-top:1px}
.search-wrap{background:var(--bg2);border-bottom:1px solid var(--border);padding:9px 14px}
.search-box{display:flex;align-items:center;gap:8px;background:var(--bg3);border:1px solid var(--border);border-radius:10px;padding:8px 12px}
.search-box input{background:none;border:none;outline:none;font-size:13px;font-family:'Plus Jakarta Sans',sans-serif;color:var(--text);flex:1;-webkit-appearance:none}
.search-box input::placeholder{color:var(--text4)}
.filters{display:flex;gap:5px;overflow-x:auto;scrollbar-width:none;padding:8px 14px;background:var(--bg2);border-bottom:1px solid var(--border)}
.filters::-webkit-scrollbar{display:none}
.fc{flex-shrink:0;padding:5px 11px;border-radius:20px;font-size:10px;font-weight:600;cursor:pointer;border:1px solid var(--border2);background:var(--bg3);color:var(--text2);-webkit-appearance:none;white-space:nowrap}
.fc.on{background:var(--navy);border-color:var(--navy);color:#fff}
.sort-row{display:flex;align-items:center;justify-content:space-between;padding:7px 14px;background:var(--bg2);border-bottom:1px solid var(--border)}
.sort-lbl{font-size:11px;color:var(--text3)}
.sort-row-right{display:flex;align-items:center;gap:8px}
.sort-sel{background:none;border:none;outline:none;font-size:11px;font-weight:600;color:var(--text);cursor:pointer;-webkit-appearance:none;font-family:'Plus Jakarta Sans',sans-serif}
.sel-all-btn{font-size:11px;font-weight:600;color:var(--blue2);background:none;border:none;cursor:pointer;-webkit-appearance:none;padding:0}
.cards{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:10px 14px}
.cards::-webkit-scrollbar{display:none}
.ccard{background:var(--bg2);border:1px solid var(--border);border-radius:14px;margin-bottom:8px;overflow:hidden;box-shadow:var(--sh);position:relative}
.ccard.selected{border-color:var(--blue2);box-shadow:0 0 0 2px rgba(32,96,208,.2)}
.ccard-sel-check{position:absolute;top:10px;left:10px;width:20px;height:20px;border-radius:6px;border:2px solid var(--border2);background:var(--bg2);display:none;align-items:center;justify-content:center;z-index:5;cursor:pointer;-webkit-appearance:none;font-size:11px}
.ccard-sel-check.show{display:flex}
.ccard-sel-check.checked{background:var(--blue2);border-color:var(--blue2);color:#fff}
.ccard-stripe{height:3px}
.ccard-body{padding:12px 13px 10px}
.ccard-top{display:flex;align-items:flex-start;gap:10px;margin-bottom:8px}
.ccard-av{width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:800;color:#fff;flex-shrink:0}
.ccard-name{font-size:14px;font-weight:700;margin-bottom:2px;line-height:1.2}
.ccard-ph{font-size:12px;color:var(--text3);margin-bottom:3px}
.ccard-tags{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:2px}
.ctag{font-size:9px;font-weight:600;border-radius:5px;padding:2px 7px;background:var(--bg3);color:var(--text2)}
.ctag.gold{background:var(--orange3);color:var(--orange2)}
.ctag.green{background:var(--green3);color:var(--green2)}
.ctag.blue{background:var(--blue3);color:var(--blue2)}
.ccard-st{padding:3px 9px;border-radius:20px;font-size:10px;font-weight:700;white-space:nowrap;flex-shrink:0}
.ccard-komisyon{font-family:'DM Mono';font-size:10px;color:var(--gold2);font-weight:500;margin-top:2px}
.ccard-note{font-size:11px;color:var(--text3);margin-top:6px;padding-top:8px;border-top:1px solid var(--border);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ccard-foot{display:flex;align-items:center;gap:6px;padding:7px 12px;background:var(--bg3)}
.ccard-date{font-size:10px;color:var(--text4);flex:1}
.ccard-reminder{font-size:10px;color:var(--gold2);font-weight:600}
.cbtn{width:28px;height:28px;border-radius:8px;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:13px;-webkit-appearance:none}
.cbtn.wa{background:var(--green3);color:var(--green2)}
.cbtn.ph{background:var(--blue3);color:var(--blue2)}
.cbtn.ed{background:var(--bg4);color:var(--text3)}
.hot-badge{background:linear-gradient(135deg,#ff3030,#ff7010);color:#fff;font-size:8px;font-weight:700;padding:1px 6px;border-radius:10px;margin-right:3px}
.komisyon-badge{background:var(--green3);color:var(--green2);font-size:8px;font-weight:700;padding:1px 6px;border-radius:10px;margin-right:3px}
/* BULK BAR */
.bulk-bar{background:var(--navy);padding:10px 14px;display:none;align-items:center;gap:8px;flex-shrink:0}
.bulk-bar.show{display:flex}
.bulk-info{font-size:12px;font-weight:600;color:#fff;flex:1}
.bulk-btn{padding:6px 12px;border:none;border-radius:8px;font-size:11px;font-weight:600;cursor:pointer;-webkit-appearance:none;white-space:nowrap}
.bulk-btn.st{background:var(--gold3);color:var(--navy)}
.bulk-btn.dl{background:var(--red3);color:var(--red2)}
.bulk-btn.cancel{background:rgba(255,255,255,.15);color:#fff}
/* PIPELINE */
.pl-area{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:12px 14px}
.pl-area::-webkit-scrollbar{display:none}
.pl-block{background:var(--bg2);border:1px solid var(--border);border-radius:14px;margin-bottom:10px;overflow:hidden;box-shadow:var(--sh)}
.pl-hdr{display:flex;align-items:center;gap:9px;padding:11px 13px;border-bottom:1px solid var(--border)}
.pl-name{font-weight:700;font-size:13px;flex:1}
.pl-cnt{font-family:'DM Mono';font-size:20px;font-weight:500}
.pl-mini{display:flex;align-items:center;gap:8px;padding:8px;border-radius:9px;background:var(--bg3);margin-bottom:5px;cursor:pointer}
.pl-mini-av{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;color:#fff;flex-shrink:0}
/* DASHBOARD */
.dash{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:12px 14px}
.dash::-webkit-scrollbar{display:none}
.kpi-row{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
.kpi{background:var(--bg2);border:1px solid var(--border);border-radius:12px;padding:13px;box-shadow:var(--sh)}
.kpi-val{font-family:'DM Mono';font-size:24px;font-weight:500;margin-bottom:3px}
.kpi-lbl{font-size:10px;color:var(--text3)}
.kpi-sub{font-size:9px;font-weight:600;margin-top:4px}
.chart-card{background:var(--bg2);border:1px solid var(--border);border-radius:12px;padding:13px;margin-bottom:10px;box-shadow:var(--sh)}
.chart-ttl{font-size:10px;font-weight:700;color:var(--text2);text-transform:uppercase;letter-spacing:.5px;margin-bottom:11px}
.bar-row{display:flex;align-items:center;gap:7px;margin-bottom:7px}
.bar-lbl{font-size:10px;color:var(--text2);width:78px;flex-shrink:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar-track{flex:1;height:7px;background:var(--bg3);border-radius:4px;overflow:hidden}
.bar-fill{height:100%;border-radius:4px}
.bar-cnt{font-family:'DM Mono';font-size:10px;color:var(--text3);width:20px;text-align:right;flex-shrink:0}
/* TAKVIM */
.cal-area{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:12px 14px}
.cal-area::-webkit-scrollbar{display:none}
.cal-block{background:var(--bg2);border:1px solid var(--border);border-radius:12px;margin-bottom:9px;overflow:hidden;box-shadow:var(--sh)}
.cal-hdr{display:flex;align-items:center;justify-content:space-between;padding:9px 12px;background:var(--bg3);border-bottom:1px solid var(--border)}
.cal-date-lbl{font-size:12px;font-weight:700}
.cal-cnt{font-size:10px;color:var(--text3)}
.rem-item{display:flex;align-items:center;gap:9px;padding:10px 12px;border-bottom:1px solid var(--border)}
.rem-item:last-child{border-bottom:none}
.rem-time{font-family:'DM Mono';font-size:11px;color:var(--text3);width:38px;flex-shrink:0}
.rem-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.rem-name{font-weight:600;font-size:12px}
.rem-note{font-size:10px;color:var(--text3);margin-top:1px}
.rem-done-btn{width:24px;height:24px;border-radius:7px;border:1.5px solid var(--border2);background:none;cursor:pointer;-webkit-appearance:none;display:flex;align-items:center;justify-content:center;font-size:12px;flex-shrink:0;color:var(--text3)}
.rem-done-btn.checked{background:var(--green2);border-color:var(--green2);color:#fff}
/* MODAL */
.modal-ov{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:200;display:none;align-items:flex-end;backdrop-filter:blur(4px)}
.modal-ov.show{display:flex}
.modal-sh{background:var(--bg2);border-radius:20px 20px 0 0;width:100%;max-height:95dvh;overflow-y:auto;position:relative}
.modal-sh::-webkit-scrollbar{display:none}
.modal-drag{width:36px;height:4px;background:var(--bg4);border-radius:2px;margin:14px auto 0}
.modal-hdr{padding:13px 17px 11px;border-bottom:1px solid var(--border)}
.modal-ttl{font-size:17px;font-weight:800}
.modal-sub{font-size:11px;color:var(--text3);margin-top:2px}
.modal-x{position:absolute;top:12px;right:13px;width:27px;height:27px;background:var(--bg3);border:none;border-radius:50%;cursor:pointer;-webkit-appearance:none;font-size:14px;color:var(--text2);display:flex;align-items:center;justify-content:center}
.modal-body{padding:14px 16px 32px}
.fg{margin-bottom:12px}
.fg label{display:block;font-size:10px;font-weight:700;color:var(--text2);text-transform:uppercase;letter-spacing:.5px;margin-bottom:4px}
.fi{width:100%;padding:10px 12px;border:1.5px solid var(--border2);border-radius:10px;font-size:13px;font-family:'Plus Jakarta Sans',sans-serif;color:var(--text);background:var(--bg2);outline:none;-webkit-appearance:none}
.fi:focus{border-color:var(--navy)}
.fi::placeholder{color:var(--text4)}
.frow{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.fta{width:100%;padding:10px 12px;border:1.5px solid var(--border2);border-radius:10px;font-size:13px;font-family:'Plus Jakarta Sans',sans-serif;color:var(--text);background:var(--bg2);outline:none;-webkit-appearance:none;resize:none;line-height:1.5}
.opt-g2{display:grid;grid-template-columns:1fr 1fr;gap:5px}
.opt-g3{display:grid;grid-template-columns:repeat(3,1fr);gap:5px}
.opt-g4{display:grid;grid-template-columns:repeat(4,1fr);gap:5px}
.opt-btn{padding:8px 4px;background:var(--bg3);border:1.5px solid var(--border);border-radius:9px;text-align:center;cursor:pointer;font-size:10px;font-weight:600;color:var(--text2);-webkit-appearance:none;line-height:1.4}
.opt-btn.on{background:var(--navy);border-color:var(--navy);color:#fff}
.st-opts{display:flex;flex-direction:column;gap:5px}
.st-opt{display:flex;align-items:center;gap:9px;padding:9px 11px;border:1.5px solid var(--border);border-radius:9px;cursor:pointer;-webkit-appearance:none;background:var(--bg2);width:100%;text-align:left}
.st-opt.on{border-width:2px}
.st-dot{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.btn-save{width:100%;padding:13px;background:var(--navy);border:none;border-radius:13px;color:#fff;font-size:14px;font-weight:700;cursor:pointer;-webkit-appearance:none;font-family:'Plus Jakarta Sans',sans-serif;margin-top:4px}
.btn-sec{width:100%;padding:11px;background:transparent;border:1.5px solid var(--border2);border-radius:13px;color:var(--text2);font-size:13px;font-weight:600;cursor:pointer;-webkit-appearance:none;font-family:'Plus Jakarta Sans',sans-serif;margin-top:7px}
/* DETAIL */
.det-hero{padding:18px 16px 14px}
.det-av{width:56px;height:56px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:800;color:#fff;margin-bottom:10px}
.det-name{font-size:20px;font-weight:800;color:#fff;margin-bottom:2px}
.det-ph{font-size:12px;color:rgba(255,255,255,.6);margin-bottom:8px}
.det-st{display:inline-block;padding:3px 11px;border-radius:20px;font-size:10px;font-weight:700;background:rgba(255,255,255,.15);color:#fff}
.det-actions{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;padding:11px 14px;background:var(--bg3);border-bottom:1px solid var(--border)}
.da{background:var(--bg4);border:none;border-radius:10px;padding:9px 4px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:8px;font-weight:700;color:var(--text2);-webkit-appearance:none;text-transform:uppercase;letter-spacing:.3px}
.da span{font-size:19px}
.da.wa{background:var(--green3);color:var(--green2)}
.da.ph{background:var(--blue3);color:var(--blue2)}
.da.sms{background:var(--purple3);color:var(--purple2)}
.info-sec{padding:12px 16px;border-bottom:1px solid var(--border)}
.info-sec-ttl{font-size:10px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.7px;margin-bottom:9px}
.info-row{display:flex;gap:9px;margin-bottom:8px;align-items:flex-start}
.info-ico{font-size:13px;width:24px;text-align:center;color:var(--text3);flex-shrink:0;margin-top:1px}
.info-lbl{font-size:9px;color:var(--text3);margin-bottom:1px}
.info-val{font-size:13px;font-weight:600}
.note-card{background:var(--bg3);border-left:3px solid var(--gold2);border-radius:0 9px 9px 0;padding:9px 11px;margin-bottom:7px}
.note-type-lbl{font-size:8px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.5px;margin-bottom:3px}
.note-txt{font-size:12px;line-height:1.6;color:var(--text)}
.note-date{font-size:9px;color:var(--text4);margin-top:4px}
.add-note-btn{width:100%;padding:9px;background:transparent;border:1.5px dashed var(--border2);border-radius:9px;color:var(--text3);font-size:11px;cursor:pointer;-webkit-appearance:none}
/* TIMELINE */
.tl-item{display:flex;gap:10px;position:relative;padding-bottom:10px}
.tl-item:not(:last-child)::after{content:'';position:absolute;left:5px;top:12px;width:1px;height:100%;background:var(--border2)}
.tl-dot{width:11px;height:11px;border-radius:50%;flex-shrink:0;margin-top:2px;border:2px solid var(--bg2);box-shadow:0 0 0 1px var(--border)}
.tl-body{flex:1}
.tl-st{font-size:12px;font-weight:700}
.tl-dt{font-size:10px;color:var(--text3);margin-top:1px}
/* CHANGE STATUS */
.cs-btns{display:flex;flex-wrap:wrap;gap:5px;margin-top:7px}
.cs-btn{padding:5px 10px;border-radius:20px;border:1.5px solid;background:transparent;font-size:10px;font-weight:700;cursor:pointer;-webkit-appearance:none}
/* WA TEMPLATES */
.wa-tpl{background:var(--bg3);border:1px solid var(--border);border-radius:10px;padding:11px 12px;margin-bottom:7px;cursor:pointer}
.wa-tpl:active{background:var(--bg4)}
.wa-tpl-ttl{font-size:12px;font-weight:700;margin-bottom:4px}
.wa-tpl-prev{font-size:11px;color:var(--text3);line-height:1.5;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
/* KOMISYON */
.kom-box{background:linear-gradient(135deg,var(--green3),rgba(212,240,220,.4));border:1px solid rgba(30,158,72,.2);border-radius:12px;padding:13px;margin-bottom:10px}
.kom-ttl{font-size:10px;font-weight:700;color:var(--green2);text-transform:uppercase;letter-spacing:.5px;margin-bottom:8px}
.kom-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:5px}
.kom-lbl{font-size:11px;color:var(--text2)}
.kom-val{font-family:'DM Mono';font-size:13px;font-weight:600;color:var(--green2)}
.kom-total{border-top:1px solid rgba(30,158,72,.2);padding-top:8px;margin-top:5px;display:flex;justify-content:space-between}
.kom-total-lbl{font-size:12px;font-weight:700}
.kom-total-val{font-family:'DM Mono';font-size:16px;font-weight:700;color:var(--green2)}
/* DEL */
.del-btn{width:100%;padding:11px;background:var(--red3);border:1.5px solid rgba(200,40,40,.2);border-radius:10px;color:var(--red2);font-size:12px;font-weight:600;cursor:pointer;-webkit-appearance:none;font-family:'Plus Jakarta Sans',sans-serif;display:flex;align-items:center;justify-content:center;gap:6px}
.gorev-date-row{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:4px;margin-bottom:12px}
.gorev-date-row::-webkit-scrollbar{display:none}
.gdate-chip{flex-shrink:0;padding:7px 10px;border-radius:20px;font-size:11px;font-weight:600;cursor:pointer;border:1px solid var(--border2);background:var(--bg3);color:var(--text2);-webkit-appearance:none;text-align:center;min-width:48px}
.gdate-chip.on{background:var(--navy);border-color:var(--navy);color:#fff}
.gdate-sub{font-size:8px;display:block;margin-bottom:1px;opacity:.7}
.gcat-row{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin-bottom:12px}
.gcat-row::-webkit-scrollbar{display:none}
.gcat{flex-shrink:0;padding:5px 12px;border-radius:20px;font-size:11px;font-weight:600;cursor:pointer;border:1px solid var(--border2);background:var(--bg3);color:var(--text2);-webkit-appearance:none}
.gcat.on{background:var(--navy);border-color:var(--navy);color:#fff}
.gp-box{background:var(--bg2);border:1px solid var(--border);border-radius:12px;padding:13px;margin-bottom:12px;box-shadow:var(--sh)}
.gp-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.gp-ttl{font-size:13px;font-weight:700}
.gp-pct{font-family:'DM Mono';font-size:20px;font-weight:500;color:var(--green2)}
.gp-bar{height:8px;background:var(--bg3);border-radius:4px;overflow:hidden}
.gp-fill{height:100%;border-radius:4px;background:linear-gradient(90deg,var(--green),var(--green2));transition:width .4s}
.gp-sub{font-size:10px;color:var(--text3);margin-top:5px}
.gstats{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-bottom:12px}
.gst{background:var(--bg2);border:1px solid var(--border);border-radius:10px;padding:9px 4px;text-align:center;box-shadow:var(--sh)}
.gst-n{font-family:'DM Mono';font-size:16px;font-weight:500}
.gst-l{font-size:7px;color:var(--text3);text-transform:uppercase;letter-spacing:.3px;margin-top:1px}
.gi{background:var(--bg2);border:1px solid var(--border);border-radius:12px;margin-bottom:7px;box-shadow:var(--sh);overflow:hidden}
.gi.gi-done{opacity:.55}
.gi-main{display:flex;align-items:flex-start;gap:10px;padding:11px 12px}
.gi-chk{width:22px;height:22px;border-radius:7px;border:2px solid var(--border2);background:var(--bg3);flex-shrink:0;cursor:pointer;-webkit-appearance:none;display:flex;align-items:center;justify-content:center;font-size:12px;margin-top:1px}
.gi-chk.done{background:var(--green2);border-color:var(--green2);color:#fff}
.gi-txt{font-size:13px;font-weight:600;line-height:1.4}
.gi-txt.done{text-decoration:line-through;color:var(--text3)}
.gi-meta{display:flex;align-items:center;gap:5px;flex-wrap:wrap;margin-top:4px}
.gi-tag{font-size:9px;font-weight:700;padding:2px 7px;border-radius:20px}
.gi-time-lbl{font-size:10px;color:var(--text3)}
.gi-cust-lbl{font-size:10px;color:var(--blue2)}
.gi-note-txt{font-size:11px;color:var(--text3);margin-top:4px;padding-top:6px;border-top:1px solid var(--border);line-height:1.5}
.gi-foot{display:flex;border-top:1px solid var(--border)}
.gi-fbtn{flex:1;padding:8px;background:none;border:none;border-right:1px solid var(--border);cursor:pointer;font-size:10px;font-weight:600;color:var(--text3);-webkit-appearance:none;display:flex;align-items:center;justify-content:center;gap:4px}
.gi-fbtn:last-child{border-right:none}
.gi-fbtn.red{color:var(--red2)}
.gi-fbtn.blue{color:var(--blue2)}
.gsec-ttl{font-size:10px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.7px;margin:12px 0 8px;display:flex;align-items:center;gap:6px}
.gsec-line{flex:1;height:1px;background:var(--border)}
.g-fab{position:fixed;bottom:80px;right:18px;width:50px;height:50px;background:linear-gradient(135deg,var(--navy2),var(--navy));border:none;border-radius:50%;color:#fff;font-size:22px;cursor:pointer;-webkit-appearance:none;box-shadow:0 4px 16px rgba(13,24,41,.35);display:none;align-items:center;justify-content:center;z-index:40}
.g-fab.show{display:flex}
.prior-high{background:var(--yellow3);color:var(--yellow2)}
.prior-urgent{background:var(--red3);color:var(--red2)}
.prior-normal{background:var(--bg3);color:var(--text2)}
/* BULK STATUS MODAL */
.bst-opts{display:flex;flex-direction:column;gap:5px}
.bst-opt{display:flex;align-items:center;gap:9px;padding:9px 11px;border:1.5px solid var(--border);border-radius:9px;cursor:pointer;-webkit-appearance:none;background:var(--bg2);width:100%;text-align:left}
/* THEME TOGGLE */
.theme-btn{background:rgba(255,255,255,.1);border:none;border-radius:8px;width:30px;height:30px;color:rgba(255,255,255,.7);font-size:15px;cursor:pointer;-webkit-appearance:none;display:flex;align-items:center;justify-content:center}
/* EMPTY */
.empty-s{text-align:center;padding:50px 20px}
.empty-ico{font-size:48px;margin-bottom:14px;opacity:.4}
.empty-ttl{font-size:16px;font-weight:700;color:var(--text2);margin-bottom:6px}
.empty-sub{font-size:12px;color:var(--text3);line-height:1.6}
/* TOAST */
.toast-wrap{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);z-index:500;display:flex;flex-direction:column-reverse;gap:5px;width:360px;max-width:calc(100% - 28px);pointer-events:none}
.toast{padding:9px 13px;border-radius:11px;font-size:12px;font-weight:600;display:flex;align-items:center;gap:7px;border:1px solid;background:var(--bg2);pointer-events:all;box-shadow:var(--sh)}
.toast.s{border-color:rgba(30,158,72,.25);color:var(--green2)}
.toast.e{border-color:rgba(220,48,48,.25);color:var(--red2)}
.toast.i{border-color:rgba(32,96,208,.25);color:var(--blue2)}
.toast.w{border-color:rgba(192,80,16,.25);color:var(--orange2)}

/* GOREV MODULE CSS */
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:var(--bg,#f5f7fa);color:var(--text,#0d1829);font-family:'Plus Jakarta Sans',sans-serif;-webkit-font-smoothing:antialiased}

/* ── GOREV APP ── */
.g-app{display:flex;flex-direction:column;height:100%;overflow:hidden}

/* TOP BAR */
.g-topbar{background:var(--bg2,#fff);border-bottom:1px solid var(--border,#e4e8ef);padding:10px 14px;flex-shrink:0}
.g-tb1{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.g-tb-title{font-size:16px;font-weight:800;flex:1}
.g-tb-btn{padding:6px 12px;border:none;border-radius:8px;font-size:11px;font-weight:700;cursor:pointer;-webkit-appearance:none;display:flex;align-items:center;gap:4px}
.g-tb-btn.primary{background:var(--navy,#0d1829);color:#fff}
.g-tb-btn.ghost{background:var(--bg3,#eef0f5);color:var(--text2,#3d4e68)}
.g-tb2{display:flex;gap:5px;overflow-x:auto;scrollbar-width:none}
.g-tb2::-webkit-scrollbar{display:none}
.g-view-btn{flex-shrink:0;padding:6px 12px;border-radius:20px;border:1px solid var(--border2,#cdd3de);background:var(--bg3,#eef0f5);color:var(--text2,#3d4e68);font-size:11px;font-weight:600;cursor:pointer;-webkit-appearance:none;white-space:nowrap}
.g-view-btn.on{background:var(--navy,#0d1829);border-color:var(--navy,#0d1829);color:#fff}

/* PROJECT SIDEBAR / STRIP */
.g-proj-strip{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:8px 14px;background:var(--bg2,#fff);border-bottom:1px solid var(--border,#e4e8ef);flex-shrink:0}
.g-proj-strip::-webkit-scrollbar{display:none}
.g-proj-chip{flex-shrink:0;display:flex;align-items:center;gap:5px;padding:5px 11px;border-radius:20px;border:1px solid var(--border2,#cdd3de);background:var(--bg3,#eef0f5);color:var(--text2,#3d4e68);font-size:11px;font-weight:600;cursor:pointer;-webkit-appearance:none;white-space:nowrap}
.g-proj-chip.on{color:#fff;border-color:transparent}
.g-proj-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.g-proj-add{flex-shrink:0;width:28px;height:28px;border-radius:50%;background:var(--bg3,#eef0f5);border:1px dashed var(--border2,#cdd3de);color:var(--text3,#7a8ea8);font-size:16px;cursor:pointer;-webkit-appearance:none;display:flex;align-items:center;justify-content:center}

/* SEARCH + FILTER */
.g-search-row{display:flex;align-items:center;gap:7px;padding:8px 14px;background:var(--bg2,#fff);border-bottom:1px solid var(--border,#e4e8ef);flex-shrink:0}
.g-search-box{flex:1;display:flex;align-items:center;gap:7px;background:var(--bg3,#eef0f5);border:1px solid var(--border,#e4e8ef);border-radius:9px;padding:7px 11px}
.g-search-box input{background:none;border:none;outline:none;font-size:13px;font-family:'Plus Jakarta Sans',sans-serif;color:var(--text,#0d1829);flex:1;-webkit-appearance:none}
.g-search-box input::placeholder{color:var(--text4,#b8c8d8)}
.g-filter-btn{flex-shrink:0;width:34px;height:34px;background:var(--bg3,#eef0f5);border:1px solid var(--border,#e4e8ef);border-radius:9px;cursor:pointer;-webkit-appearance:none;display:flex;align-items:center;justify-content:center;font-size:15px;color:var(--text3,#7a8ea8)}
.g-filter-btn.active{background:var(--blue3,#dce8fc);border-color:var(--blue2,#2060d0);color:var(--blue2,#2060d0)}

/* SCROLL AREA */
.g-scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:12px 14px}
.g-scroll::-webkit-scrollbar{display:none}

/* ── LIST VIEW ── */
.g-group{margin-bottom:16px}
.g-group-hdr{display:flex;align-items:center;gap:8px;margin-bottom:8px;cursor:pointer}
.g-group-arrow{font-size:11px;color:var(--text3,#7a8ea8);transition:transform .2s;flex-shrink:0}
.g-group-arrow.open{transform:rotate(90deg)}
.g-group-name{font-size:13px;font-weight:700;flex:1}
.g-group-cnt{font-family:'DM Mono';font-size:11px;color:var(--text3,#7a8ea8)}
.g-group-add{font-size:11px;color:var(--blue2,#2060d0);background:none;border:none;cursor:pointer;-webkit-appearance:none;padding:2px 6px;border-radius:5px}

.g-task{background:var(--bg2,#fff);border:1px solid var(--border,#e4e8ef);border-radius:11px;margin-bottom:6px;overflow:hidden;box-shadow:0 1px 3px rgba(13,24,41,.05);transition:box-shadow .15s}
.g-task.dragging{opacity:.5;box-shadow:0 8px 24px rgba(13,24,41,.15)}
.g-task.drag-over{border-color:var(--blue2,#2060d0);box-shadow:0 0 0 2px rgba(32,96,208,.2)}
.g-task-main{display:flex;align-items:flex-start;gap:9px;padding:11px 12px 9px}
.g-task-drag-handle{font-size:14px;color:var(--text4,#b8c8d8);cursor:grab;flex-shrink:0;margin-top:2px;padding:0 2px;touch-action:none}
.g-task-drag-handle:active{cursor:grabbing}
.g-chk{width:20px;height:20px;border-radius:6px;border:2px solid var(--border2,#cdd3de);background:var(--bg3,#eef0f5);flex-shrink:0;cursor:pointer;-webkit-appearance:none;display:flex;align-items:center;justify-content:center;font-size:11px;color:#fff;margin-top:1px;transition:all .15s}
.g-chk.done{background:var(--green2,#1e9848);border-color:var(--green2,#1e9848)}
.g-task-body{flex:1;min-width:0}
.g-task-title{font-size:13px;font-weight:600;line-height:1.4;margin-bottom:4px;word-break:break-word}
.g-task-title.done{text-decoration:line-through;color:var(--text3,#7a8ea8)}
.g-task-meta{display:flex;flex-wrap:wrap;align-items:center;gap:4px}
.g-tag{font-size:9px;font-weight:700;padding:2px 7px;border-radius:20px;white-space:nowrap}
.g-task-note{font-size:11px;color:var(--text3,#7a8ea8);margin-top:5px;line-height:1.5;padding-top:6px;border-top:1px solid var(--border,#e4e8ef)}
.g-subtask-bar{margin-top:5px}
.g-subtask-prog{height:3px;background:var(--bg3,#eef0f5);border-radius:2px;overflow:hidden;margin-top:3px}
.g-subtask-fill{height:100%;background:var(--green2,#1e9848);border-radius:2px}
.g-task-expand{flex-shrink:0;width:24px;height:24px;background:none;border:none;cursor:pointer;-webkit-appearance:none;color:var(--text4,#b8c8d8);font-size:14px;display:flex;align-items:center;justify-content:center;margin-top:1px}
.g-task-actions{display:flex;border-top:1px solid var(--border,#e4e8ef)}
.g-ta-btn{flex:1;padding:7px;background:none;border:none;border-right:1px solid var(--border,#e4e8ef);cursor:pointer;font-size:10px;font-weight:600;color:var(--text3,#7a8ea8);-webkit-appearance:none;display:flex;align-items:center;justify-content:center;gap:3px}
.g-ta-btn:last-child{border-right:none}
.g-ta-btn.red{color:var(--red2,#d83030)}
.g-ta-btn.blue{color:var(--blue2,#2060d0)}
.g-ta-btn.green{color:var(--green2,#1e9848)}

/* SUBTASKS */
.g-subtasks{padding:0 12px 10px 44px}
.g-st-item{display:flex;align-items:center;gap:7px;padding:5px 0;border-bottom:1px solid var(--border,#e4e8ef)}
.g-st-item:last-child{border-bottom:none}
.g-st-chk{width:16px;height:16px;border-radius:4px;border:1.5px solid var(--border2,#cdd3de);background:var(--bg3,#eef0f5);flex-shrink:0;cursor:pointer;-webkit-appearance:none;display:flex;align-items:center;justify-content:center;font-size:9px;color:#fff}
.g-st-chk.done{background:var(--green2,#1e9848);border-color:var(--green2,#1e9848)}
.g-st-txt{font-size:12px;flex:1}
.g-st-txt.done{text-decoration:line-through;color:var(--text3,#7a8ea8)}
.g-st-del{background:none;border:none;color:var(--text4,#b8c8d8);font-size:13px;cursor:pointer;-webkit-appearance:none;flex-shrink:0}

/* QUICK ADD */
.g-quick-add{display:flex;align-items:center;gap:7px;padding:9px 12px;background:var(--bg3,#eef0f5);border:1px dashed var(--border2,#cdd3de);border-radius:11px;margin-bottom:8px;cursor:pointer}
.g-quick-add-ico{font-size:14px;color:var(--text3,#7a8ea8)}
.g-quick-add-txt{font-size:13px;color:var(--text3,#7a8ea8)}

/* ── KANBAN ── */
.g-kanban{display:flex;gap:10px;overflow-x:auto;scrollbar-width:none;padding-bottom:12px;height:100%;align-items:flex-start}
.g-kanban::-webkit-scrollbar{display:none}
.g-kb-col{flex-shrink:0;width:240px;background:var(--bg3,#eef0f5);border-radius:13px;overflow:hidden;display:flex;flex-direction:column;max-height:calc(100vh - 220px)}
.g-kb-hdr{display:flex;align-items:center;gap:7px;padding:11px 13px 9px;background:var(--bg3,#eef0f5);flex-shrink:0}
.g-kb-dot{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.g-kb-name{font-size:12px;font-weight:700;flex:1}
.g-kb-cnt{font-family:'DM Mono';font-size:11px;color:var(--text3,#7a8ea8)}
.g-kb-body{flex:1;overflow-y:auto;padding:6px 8px 8px;scrollbar-width:none}
.g-kb-body::-webkit-scrollbar{display:none}
.g-kb-card{background:var(--bg2,#fff);border:1px solid var(--border,#e4e8ef);border-radius:10px;padding:11px;margin-bottom:7px;cursor:pointer;box-shadow:0 1px 3px rgba(13,24,41,.05)}
.g-kb-card:active{opacity:.85}
.g-kb-card-title{font-size:12px;font-weight:600;line-height:1.4;margin-bottom:7px}
.g-kb-card-title.done{text-decoration:line-through;color:var(--text3,#7a8ea8)}
.g-kb-card-meta{display:flex;flex-wrap:wrap;gap:4px}
.g-kb-add{width:100%;padding:8px;background:none;border:1px dashed var(--border2,#cdd3de);border-radius:9px;color:var(--text3,#7a8ea8);font-size:11px;cursor:pointer;-webkit-appearance:none;margin:0 8px 8px;width:calc(100% - 16px)}

/* ── CALENDAR ── */
.g-cal-nav{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;flex-shrink:0}
.g-cal-month{font-size:16px;font-weight:800}
.g-cal-nav-btn{width:32px;height:32px;background:var(--bg3,#eef0f5);border:1px solid var(--border,#e4e8ef);border-radius:9px;cursor:pointer;-webkit-appearance:none;font-size:14px;display:flex;align-items:center;justify-content:center;color:var(--text2,#3d4e68)}
.g-cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:1px;background:var(--border,#e4e8ef);border:1px solid var(--border,#e4e8ef);border-radius:12px;overflow:hidden;flex-shrink:0;margin:0 14px}
.g-cal-day-name{background:var(--bg3,#eef0f5);padding:7px 4px;text-align:center;font-size:9px;font-weight:700;color:var(--text3,#7a8ea8);text-transform:uppercase}
.g-cal-cell{background:var(--bg2,#fff);padding:5px 4px;min-height:52px;cursor:pointer;position:relative}
.g-cal-cell.other-month{background:var(--bg3,#eef0f5);opacity:.5}
.g-cal-cell.today{background:var(--blue3,#dce8fc)}
.g-cal-cell.selected{background:var(--navy,#0d1829)}
.g-cal-cell-num{font-size:11px;font-weight:700;color:var(--text2,#3d4e68);margin-bottom:3px}
.g-cal-cell.today .g-cal-cell-num{color:var(--blue2,#2060d0)}
.g-cal-cell.selected .g-cal-cell-num{color:#fff}
.g-cal-dot-row{display:flex;flex-wrap:wrap;gap:2px}
.g-cal-dot{width:5px;height:5px;border-radius:50%}
.g-cal-day-tasks{flex:1;overflow-y:auto;padding:10px 14px;scrollbar-width:none}
.g-cal-day-tasks::-webkit-scrollbar{display:none}
.g-cal-day-hdr{font-size:13px;font-weight:700;margin-bottom:8px;color:var(--text2,#3d4e68)}

/* ── TABLE ── */
.g-table-wrap{overflow-x:auto;scrollbar-width:none}
.g-table-wrap::-webkit-scrollbar{display:none}
.g-table{width:100%;border-collapse:collapse;min-width:600px}
.g-table th{background:var(--bg3,#eef0f5);padding:8px 12px;text-align:left;font-size:10px;font-weight:700;color:var(--text3,#7a8ea8);text-transform:uppercase;letter-spacing:.5px;border-bottom:2px solid var(--border,#e4e8ef);white-space:nowrap}
.g-table td{padding:10px 12px;border-bottom:1px solid var(--border,#e4e8ef);font-size:12px;vertical-align:middle;background:var(--bg2,#fff)}
.g-table tr:hover td{background:var(--bg3,#eef0f5)}
.g-table tr.done-row td{opacity:.55}
.g-table .g-chk-sm{width:16px;height:16px;border-radius:5px;border:1.5px solid var(--border2,#cdd3de);background:var(--bg3,#eef0f5);cursor:pointer;-webkit-appearance:none;display:inline-flex;align-items:center;justify-content:center;font-size:9px;color:#fff;vertical-align:middle}
.g-table .g-chk-sm.done{background:var(--green2,#1e9848);border-color:var(--green2,#1e9848)}

/* ── MODAL ── */
.g-modal-ov{position:fixed;inset:0;background:rgba(13,24,41,.65);z-index:300;display:none;align-items:flex-end;backdrop-filter:blur(4px)}
.g-modal-ov.show{display:flex}
.g-modal-sh{background:var(--bg2,#fff);border-radius:20px 20px 0 0;width:100%;max-height:96dvh;overflow-y:auto;position:relative}
.g-modal-sh::-webkit-scrollbar{display:none}
.g-modal-drag{width:36px;height:4px;background:var(--bg4,#e2e6ed);border-radius:2px;margin:13px auto 0}
.g-modal-hdr{padding:13px 16px 11px;border-bottom:1px solid var(--border,#e4e8ef)}
.g-modal-ttl{font-size:17px;font-weight:800}
.g-modal-sub{font-size:11px;color:var(--text3,#7a8ea8);margin-top:2px}
.g-modal-x{position:absolute;top:12px;right:13px;width:27px;height:27px;background:var(--bg3,#eef0f5);border:none;border-radius:50%;cursor:pointer;-webkit-appearance:none;font-size:13px;color:var(--text2,#3d4e68);display:flex;align-items:center;justify-content:center}
.g-modal-body{padding:14px 16px 36px}

/* FORM */
.gf{margin-bottom:11px}
.gf label{display:block;font-size:10px;font-weight:700;color:var(--text2,#3d4e68);text-transform:uppercase;letter-spacing:.5px;margin-bottom:4px}
.gfi{width:100%;padding:10px 12px;border:1.5px solid var(--border2,#cdd3de);border-radius:10px;font-size:13px;font-family:'Plus Jakarta Sans',sans-serif;color:var(--text,#0d1829);background:var(--bg2,#fff);outline:none;-webkit-appearance:none}
.gfi:focus{border-color:var(--navy,#0d1829)}
.gfi::placeholder{color:var(--text4,#b8c8d8)}
.gfta{width:100%;padding:10px 12px;border:1.5px solid var(--border2,#cdd3de);border-radius:10px;font-size:13px;font-family:'Plus Jakarta Sans',sans-serif;color:var(--text,#0d1829);background:var(--bg2,#fff);outline:none;-webkit-appearance:none;resize:none;line-height:1.6;min-height:80px}
.gfta:focus{border-color:var(--navy,#0d1829)}
.gfrow{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.g-opt-g3{display:grid;grid-template-columns:repeat(3,1fr);gap:5px}
.g-opt-g4{display:grid;grid-template-columns:repeat(4,1fr);gap:5px}
.g-opt{padding:7px 4px;background:var(--bg3,#eef0f5);border:1.5px solid var(--border,#e4e8ef);border-radius:9px;text-align:center;cursor:pointer;font-size:10px;font-weight:600;color:var(--text2,#3d4e68);-webkit-appearance:none;line-height:1.4}
.g-opt.on{background:var(--navy,#0d1829);border-color:var(--navy,#0d1829);color:#fff}
.g-btn-save{width:100%;padding:13px;background:var(--navy,#0d1829);border:none;border-radius:13px;color:#fff;font-size:14px;font-weight:700;cursor:pointer;-webkit-appearance:none;font-family:'Plus Jakarta Sans',sans-serif;margin-top:4px}
.g-btn-sec{width:100%;padding:11px;background:transparent;border:1.5px solid var(--border2,#cdd3de);border-radius:13px;color:var(--text2,#3d4e68);font-size:13px;font-weight:600;cursor:pointer;-webkit-appearance:none;font-family:'Plus Jakarta Sans',sans-serif;margin-top:7px}
.g-btn-del{width:100%;padding:11px;background:var(--red3,#fde0e0);border:1.5px solid rgba(200,40,40,.2);border-radius:13px;color:var(--red2,#d83030);font-size:12px;font-weight:600;cursor:pointer;-webkit-appearance:none;font-family:'Plus Jakarta Sans',sans-serif;margin-top:9px}

/* DETAIL */
.g-det-hero{padding:18px 16px 14px;border-bottom:1px solid var(--border,#e4e8ef)}
.g-det-proj{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px;opacity:.7}
.g-det-title{font-size:19px;font-weight:800;line-height:1.3;margin-bottom:10px;word-break:break-word}
.g-det-meta{display:flex;flex-wrap:wrap;gap:6px}
.g-det-sec{padding:12px 16px;border-bottom:1px solid var(--border,#e4e8ef)}
.g-det-sec-ttl{font-size:10px;font-weight:700;color:var(--text3,#7a8ea8);text-transform:uppercase;letter-spacing:.7px;margin-bottom:9px}
.g-det-info-row{display:flex;align-items:center;gap:9px;margin-bottom:8px}
.g-det-info-lbl{font-size:10px;color:var(--text3,#7a8ea8);width:80px;flex-shrink:0}
.g-det-info-val{font-size:13px;font-weight:600;flex:1}
.g-note-content{font-size:13px;line-height:1.8;color:var(--text,#0d1829);white-space:pre-wrap;word-break:break-word}
.g-det-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:13px 16px}

/* PROJECT MODAL */
.g-color-grid{display:grid;grid-template-columns:repeat(8,1fr);gap:6px}
.g-color-opt{width:100%;aspect-ratio:1;border-radius:50%;border:2px solid transparent;cursor:pointer;-webkit-appearance:none}
.g-color-opt.on{border-color:var(--navy,#0d1829);transform:scale(1.15)}

/* EMPTY */
.g-empty{text-align:center;padding:50px 20px;color:var(--text3,#7a8ea8)}
.g-empty-ico{font-size:48px;margin-bottom:14px;opacity:.4}
.g-empty-ttl{font-size:16px;font-weight:700;color:var(--text2,#3d4e68);margin-bottom:7px}
.g-empty-sub{font-size:13px;line-height:1.6}

/* FILTER PANEL */
.g-filter-panel{background:var(--bg2,#fff);border-bottom:1px solid var(--border,#e4e8ef);padding:10px 14px;flex-shrink:0}
.g-filter-section{margin-bottom:10px}
.g-filter-lbl{font-size:10px;font-weight:700;color:var(--text3,#7a8ea8);text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px}
.g-filter-chips{display:flex;flex-wrap:wrap;gap:5px}
.g-fchip{padding:4px 10px;border-radius:20px;border:1px solid var(--border2,#cdd3de);background:var(--bg3,#eef0f5);color:var(--text2,#3d4e68);font-size:10px;font-weight:600;cursor:pointer;-webkit-appearance:none}
.g-fchip.on{background:var(--navy,#0d1829);border-color:var(--navy,#0d1829);color:#fff}
</style>
</head>
<body>
<div id="app">
<!-- HEADER -->
<div class="hdr">
  <div class="hdr-top">
    <div class="hdr-logo">&#127968;</div>
    <div style="flex:1"><div class="hdr-ttl">Mulk Rehberim</div><div class="hdr-sub" id="hdr-sub">Yukleniyor...</div></div>
    <div class="hdr-btns">
      <button class="theme-btn" onclick="toggleTheme()" title="Tema">&#9790;</button>
      <button class="theme-btn" id="snd-btn" onclick="toggleSound()" title="Ses">&#128266;</button>
      <button class="hdr-btn" onclick="exportCSV()" title="Disari Aktar">&#128190;</button>
      <button class="hdr-add" onclick="openAdd()">&#43; Musteri</button>
    </div>
  </div>
  <div class="ntabs">
    <button class="ntab on" id="nt-liste" onclick="navTo('liste')">Musteriler</button>
    <button class="ntab" id="nt-pipeline" onclick="navTo('pipeline')">Pipeline</button>
    <button class="ntab" id="nt-dashboard" onclick="navTo('dashboard')">Dashboard</button>
    <button class="ntab" id="nt-takvim" onclick="navTo('takvim')">Takvim</button>
    <button class="ntab" id="nt-komisyon" onclick="navTo('komisyon')">Komisyon</button>
    <button class="ntab" id="nt-gorev" onclick="navTo('gorev')">Gorevler</button>
  </div>
</div>

<div id="content" style="flex:1;display:flex;flex-direction:column;overflow:hidden">
  <!-- LISTE -->
  <div id="v-liste" style="display:flex;flex-direction:column;flex:1;overflow:hidden">
    <div class="stats" id="stats-bar"></div>
    <div class="search-wrap">
      <div class="search-box">
        <span style="font-size:14px;color:var(--text3)">&#128269;</span>
        <input id="search-inp" type="text" placeholder="Ad, telefon, bolge, not ara..." oninput="onSearch(this.value)">
        <span id="search-clr" style="display:none;cursor:pointer;color:var(--text3);font-size:15px" onclick="clearSearch()">&#10005;</span>
      </div>
    </div>
    <div class="filters" id="filter-bar"></div>
    <div class="sort-row">
      <span class="sort-lbl" id="result-lbl">0 musteri</span>
      <div class="sort-row-right">
        <button class="sel-all-btn" id="sel-all-btn" onclick="toggleSelectMode()">Sec</button>
        <select class="sort-sel" onchange="CUR_SORT=this.value;renderCards()">
          <option value="newest">En Yeni</option>
          <option value="name">A-Z</option>
          <option value="budget">Butce</option>
          <option value="status">Asama</option>
          <option value="updated">Son Guncelleme</option>
        </select>
      </div>
    </div>
    <div class="bulk-bar" id="bulk-bar">
      <span class="bulk-info" id="bulk-info">0 secili</span>
      <button class="bulk-btn st" onclick="openBulkStatus()">Asama Degistir</button>
      <button class="bulk-btn dl" onclick="bulkDelete()">Sil</button>
      <button class="bulk-btn cancel" onclick="toggleSelectMode()">Vazgec</button>
    </div>
    <div class="cards" id="cards"></div>
  </div>
  <!-- PIPELINE -->
  <div id="v-pipeline" style="display:none;flex:1;overflow:hidden"><div class="pl-area" id="pl-area"></div></div>
  <!-- DASHBOARD -->
  <div id="v-dashboard" style="display:none;flex:1;overflow:hidden"><div class="dash" id="dash-area"></div></div>
  <!-- TAKVIM -->
  <div id="v-takvim" style="display:none;flex:1;overflow:hidden"><div class="cal-area" id="cal-area"></div></div>
  <!-- KOMISYON -->
  <div id="v-komisyon" style="display:none;flex:1;overflow:hidden"><div class="dash" id="kom-area"></div></div>
  <div id="v-gorev" style="display:none;flex:1;overflow:hidden"><div class="dash" id="gorev-area"></div></div>
</div>

<!-- ADD MODAL -->
<div class="modal-ov" id="add-modal">
  <div class="modal-sh" style="position:relative">
    <div class="modal-drag"></div>
    <button class="modal-x" onclick="closeAdd()">&#10005;</button>

          <button class="opt-btn" onclick="selOpt('type','Ticari',this)">&#127970; Ticari</button>

      </div>
      <div class="frow">

      </div>
      <div class="fg"><label>Tahmini Satis Fiyati (TL)</label><input class="fi" id="f-satis" type="number" placeholder="3500000"></div>
      <div class="frow">
        <div class="fg"><label>Komisyon % </label><input class="fi" id="f-kom" type="number" placeholder="2" value="2"></div>
        <div class="fg"><label>Hatirlatici</label><input class="fi" id="f-reminder" type="date"></div>
      </div>
      <div class="fg"><label>Kaynak</label>
        <div class="opt-g3" id="src-grid">
          <button class="opt-btn" onclick="selOpt('src','Instagram',this)">&#128247; Instagram</button>
          <button class="opt-btn" onclick="selOpt('src','Referans',this)">&#129309; Referans</button>
          <button class="opt-btn" onclick="selOpt('src','Website',this)">&#127760; Website</button>
          <button class="opt-btn" onclick="selOpt('src','Sahibinden',this)">&#128269; Sahibinden</button>
          <button class="opt-btn" onclick="selOpt('src','Google',this)">&#128081; Google</button>
          <button class="opt-btn" onclick="selOpt('src','Diger',this)">&#128196; Diger</button>
        </div>
      </div>
      <div class="fg"><label>Oncelik</label>
        <div class="opt-g3" id="prio-grid">
          <button class="opt-btn" onclick="selOpt('prio','Normal',this)">&#128309; Normal</button>
          <button class="opt-btn" onclick="selOpt('prio','Yuksek',this)">&#128308; Yuksek</button>
          <button class="opt-btn" onclick="selOpt('prio','Sicak',this)">&#128293; Sicak</button>
        </div>
      </div>
      <div class="fg"><label>Asama</label><div class="st-opts" id="st-opts"></div></div>
      <div class="fg"><label>Not</label><textarea class="fta" id="f-note" rows="3" placeholder="Musteri beklentileri, gorusme notlari..."></textarea></div>
      <button class="btn-save" onclick="saveCust()">Kaydet</button>
      <button class="btn-sec" onclick="closeAdd()">Vazgec</button>
      <div id="del-wrap" style="margin-top:10px"></div>
    </div>
  </div>
</div>

<!-- DETAIL MODAL -->
<div class="modal-ov" id="det-modal">
  <div class="modal-sh" style="position:relative">
    <div class="modal-drag"></div>
    <button class="modal-x" style="background:rgba(255,255,255,.2);color:#fff" onclick="closeDet()">&#10005;</button>
    <div id="det-body"></div>
  </div>
</div>

<!-- NOTE MODAL -->
<div class="modal-ov" id="note-modal">
  <div class="modal-sh" style="position:relative">
    <div class="modal-drag"></div>
    <button class="modal-x" onclick="closeNote()">&#10005;</button>
    <div class="modal-hdr"><div class="modal-ttl">Not Ekle</div><div class="modal-sub" id="note-sub">Musteri icin not</div></div>
    <div class="modal-body">
      <div class="fg"><label>Not Turu</label>
        <div class="opt-g3" id="note-type-grid">
          <button class="opt-btn on" onclick="selOpt('notetype','Gorusme',this)">Gorusme</button>
          <button class="opt-btn" onclick="selOpt('notetype','Arama',this)">Arama</button>
          <button class="opt-btn" onclick="selOpt('notetype','Ziyaret',this)">Ziyaret</button>
          <button class="opt-btn" onclick="selOpt('notetype','WhatsApp',this)">WhatsApp</button>
          <button class="opt-btn" onclick="selOpt('notetype','Teklif',this)">Teklif</button>
          <button class="opt-btn" onclick="selOpt('notetype','Diger',this)">Diger</button>
        </div>
      </div>
      <div class="fg" style="margin-top:4px"><label>Not</label><textarea class="fta" id="note-inp" rows="4" placeholder="Gorusme icerigi, sonraki adimlar..."></textarea></div>
      <button class="btn-save" onclick="saveNote()" style="margin-top:4px">Kaydet</button>
      <button class="btn-sec" onclick="closeNote()">Vazgec</button>
    </div>
  </div>
</div>

<!-- WA TEMPLATE MODAL -->
<div class="modal-ov" id="wa-modal">
  <div class="modal-sh" style="position:relative">
    <div class="modal-drag"></div>
    <button class="modal-x" onclick="closeWa()">&#10005;</button>
    <div class="modal-hdr"><div class="modal-ttl">WhatsApp Mesaj</div><div class="modal-sub" id="wa-sub">Sablon sec ve gonder</div></div>
    <div class="modal-body">
      <div id="wa-tpls"></div>
      <div class="fg" style="margin-top:8px"><label>Veya Ozel Mesaj Yaz</label><textarea class="fta" id="wa-custom" rows="4" placeholder="Mesajinizi buraya yazin..."></textarea></div>
      <button class="btn-save" onclick="sendWa()" style="margin-top:4px">&#128172; WhatsApp'ta Ac</button>
      <button class="btn-sec" onclick="closeWa()">Vazgec</button>
    </div>
  </div>
</div>

<!-- REMINDER MODAL -->
<div class="modal-ov" id="rem-modal">
  <div class="modal-sh" style="position:relative">
    <div class="modal-drag"></div>
    <button class="modal-x" onclick="closeRem()">&#10005;</button>
    <div class="modal-hdr"><div class="modal-ttl">Hatirlatici Ekle</div><div class="modal-sub" id="rem-sub">Takip icin hatirlatici kur</div></div>
    <div class="modal-body">
      <div class="frow">
        <div class="fg"><label>Tarih</label><input class="fi" id="rem-date" type="date"></div>
        <div class="fg"><label>Saat</label><input class="fi" id="rem-time" type="time" value="10:00"></div>
      </div>
      <div class="fg"><label>Not</label><input class="fi" id="rem-note" type="text" placeholder="Hatirlatici notu..."></div>
      <button class="btn-save" onclick="saveRem()" style="margin-top:4px">Kaydet</button>
      <button class="btn-sec" onclick="closeRem()">Vazgec</button>
    </div>
  </div>
</div>

<!-- BULK STATUS MODAL -->
<div class="modal-ov" id="bulk-st-modal">
  <div class="modal-sh" style="position:relative">
    <div class="modal-drag"></div>
    <button class="modal-x" onclick="document.getElementById('bulk-st-modal').classList.remove('show')">&#10005;</button>
    <div class="modal-hdr"><div class="modal-ttl">Asama Degistir</div><div class="modal-sub" id="bulk-st-sub">Yeni asama sec</div></div>
    <div class="modal-body"><div class="bst-opts" id="bst-opts"></div></div>
  </div>
</div>

<div class="toast-wrap" id="toasts"></div>

<!-- GOREV FAB -->
<button class="g-fab" id="g-fab" onclick="openGorevAdd()">&#43;</button>

<!-- GOREV EKLE/DUZENLE MODAL -->
<div class="modal-ov" id="gorev-modal">
  <div class="modal-sh" style="position:relative">
    <div class="modal-drag"></div>
    <button class="modal-x" onclick="closeGorevModal()">&#10005;</button>

    <div class="modal-body">
      <input type="hidden" id="g-eid">
      <div class="fg"><label>Gorev Basligi *</label><input class="fi" id="g-text" type="text" placeholder="Ne yapacaksin?"></div>
      <div class="fg"><label>Aciklama</label><textarea class="fta" id="g-desc" rows="2" placeholder="Detay, hatirlatma notu..."></textarea></div>
      <div class="frow">
        <div class="fg"><label>Tarih</label><input class="fi" id="g-date" type="date"></div>
        <div class="fg"><label>Saat</label><input class="fi" id="g-time" type="time"></div>
      </div>
      <div class="fg"><label>Bitis Saati</label><input class="fi" id="g-time-end" type="time" placeholder="Opsiyonel"></div>
      <div class="fg"><label>Kategori</label>
        <div class="opt-g3" id="g-cat-grid">
          <button class="opt-btn on" onclick="selOpt('gcat','Genel',this)">&#127775; Genel</button>
          <button class="opt-btn" onclick="selOpt('gcat','Is',this)">&#128188; Is</button>
          <button class="opt-btn" onclick="selOpt('gcat','Kisisel',this)">&#127968; Kisisel</button>
          <button class="opt-btn" onclick="selOpt('gcat','Aile',this)">&#128106; Aile</button>
          <button class="opt-btn" onclick="selOpt('gcat','Saglik',this)">&#128138; Saglik</button>
          <button class="opt-btn" onclick="selOpt('gcat','Finans',this)">&#128176; Finans</button>
          <button class="opt-btn" onclick="selOpt('gcat','Egitim',this)">&#128218; Egitim</button>
          <button class="opt-btn" onclick="selOpt('gcat','Alisveris',this)">&#128717; Alisveris</button>
          <button class="opt-btn" onclick="selOpt('gcat','Spor',this)">&#127947; Spor</button>
        </div>
      </div>
      <div class="fg"><label>Oncelik</label>
        <div class="opt-g4" id="g-prior-grid">
          <button class="opt-btn on" onclick="selOpt('gprior','Normal',this)">Normal</button>
          <button class="opt-btn" onclick="selOpt('gprior','Yuksek',this)">&#128308; Yuksek</button>
          <button class="opt-btn" onclick="selOpt('gprior','Acil',this)">&#128293; Acil</button>
          <button class="opt-btn" onclick="selOpt('gprior','Dusuk',this)">&#128309; Dusuk</button>
        </div>
      </div>
      <div class="fg"><label>Tekrar</label>
        <div class="opt-g3" id="g-repeat-grid">
          <button class="opt-btn on" onclick="selOpt('grepeat','Yok',this)">Yok</button>
          <button class="opt-btn" onclick="selOpt('grepeat','Gunluk',this)">Gunluk</button>
          <button class="opt-btn" onclick="selOpt('grepeat','Haftalik',this)">Haftalik</button>
        </div>
      </div>
      <div class="fg"><label>Etiket (opsiyonel)</label><input class="fi" id="g-tag" type="text" placeholder="ornek: toplanti, market, doktor..."></div>
      <div class="fg"><label>Alt Gorevler</label>
        <div id="subtask-list"></div>
        <div style="display:flex;gap:7px;margin-top:6px">
          <input class="fi" id="subtask-inp" type="text" placeholder="Alt gorev ekle..." style="flex:1">
          <button onclick="addSubtask()" style="padding:9px 14px;background:var(--navy);border:none;border-radius:10px;color:#fff;font-size:12px;font-weight:600;cursor:pointer;-webkit-appearance:none;white-space:nowrap">Ekle</button>
        </div>
      </div>
      <button class="btn-save" onclick="saveGorev()">Kaydet</button>
      <button class="btn-sec" onclick="closeGorevModal()">Vazgec</button>
      <div id="g-del-wrap" style="margin-top:10px"></div>
    </div>
  </div>
</div>

<!-- GOREV DETAY MODAL -->
<div class="modal-ov" id="gdet-modal">
  <div class="modal-sh" style="position:relative">
    <div class="modal-drag"></div>
    <button class="modal-x" onclick="closeGdet()">&#10005;</button>
    <div id="gdet-body"></div>
  </div>
</div>
</div>

<script>
var CUSTOMERS = [];
var NEXT_ID = 1;
var REMINDERS = [];
var GOREVLER = [];
var GOREV_NEXT_ID = 1;
var CUR_FILTER = 'all';
var CUR_SEARCH = '';
var CUR_SORT = 'newest';
var CUR_NAV = 'liste';
var EDIT_ID = 0;
var DET_ID = 0;
var NOTE_ID = 0;
var REM_ID = 0;
var WA_ID = 0;
var SEL_TYPE = '';
var SEL_SRC = '';
var SEL_PRIO = 'Normal';
var SEL_ST = 'yeni';
var SEL_NOTE_TYPE = 'Gorusme';
var SELECT_MODE = false;
var SELECTED_IDS = [];
var DARK_MODE = false;
var G_SEL_CAT = 'Genel';
var G_SEL_PRIOR = 'Normal';
var G_SEL_REPEAT = 'Yok';
var G_CUR_DATE = '';
var G_CUR_CAT = 'all';
var G_CUR_VIEW = 'gun'; // gun | hafta | istatistik
var G_EDIT_ID = 0;
var G_SUBTASKS = [];

var STATUSES = [
  {id:'yeni',     lbl:'Yeni Lead',        color:'#1440a0', bg:'#dce8fc', dot:'#2060d0'},
  {id:'iletisim', lbl:'Iletisim',          color:'#5020a0', bg:'#ece4fc', dot:'#7040c8'},
  {id:'gorusme',  lbl:'Gorusme',           color:'#8a6000', bg:'#fef6d8', dot:'#c09000'},
  {id:'teklif',   lbl:'Teklif',            color:'#c05010', bg:'#feeadc', dot:'#e07020'},
  {id:'sozlesme', lbl:'Sozlesme',          color:'#167a38', bg:'#d4f0dc', dot:'#22a050'},
  {id:'satis',    lbl:'Kapandi',           color:'#0a4a20', bg:'#b8e8c8', dot:'#167a38'},
  {id:'iptal',    lbl:'Iptal',             color:'#8a0000', bg:'#fde4e4', dot:'#b82020'}
];
var AV_COLORS = ['#1a3a8a','#2a6a3a','#7a2a1a','#4a1a7a','#1a5a5a','#5a2a1a','#2a2a8a','#6a1a3a','#1a7a50','#7a3a1a'];
var KOM_PCT = 2;

//    UTILS   
function getSt(id) { for(var i=0;i<STATUSES.length;i++) if(STATUSES[i].id===id) return STATUSES[i]; return STATUSES[0]; }
function avColor(n) { var s=0; n=n||'X'; for(var i=0;i<n.length;i++) s+=n.charCodeAt(i); return AV_COLORS[s%AV_COLORS.length]; }
function initials(n) { n=(n||'X').trim(); var p=n.split(' '); if(p.length>=2) return p[0].charAt(0).toUpperCase()+p[p.length-1].charAt(0).toUpperCase(); return n.charAt(0).toUpperCase(); }
function fmtM(n) { if(!n) return '-'; var v=parseInt(n)||0; if(v>=1000000) return (Math.round(v/100000)/10)+'M'; if(v>=1000) return Math.round(v/1000)+'K'; return ''+v; }
function fmtFull(n) { if(!n) return '0'; return (parseInt(n)||0).toLocaleString(); }
function fmtDate(iso) {
  if(!iso) return '';
  try { var d=new Date(iso); var now=new Date(); var diff=Math.floor((now.getTime()-d.getTime())/86400000);
    if(diff===0) return 'Bugun'; if(diff===1) return 'Dun'; if(diff<7) return diff+' gun once';
    if(diff<30) return Math.floor(diff/7)+' hafta once'; return Math.floor(diff/30)+' ay once'; } catch(e) { return ''; }
}
function todayISO() { return new Date().toISOString(); }
function todayStr() { var d=new Date(); var m=d.getMonth()+1; return d.getFullYear()+'-'+(m<10?'0'+m:''+m)+'-'+(d.getDate()<10?'0'+d.getDate():''+d.getDate()); }
function thisMonth() { var d=new Date(); var m=d.getMonth()+1; return d.getFullYear()+'-'+(m<10?'0'+m:''+m); }
function safeH(s) { return (s||'').split('&').join('&amp;').split('<').join('&lt;').split('>').join('&gt;').split('"').join('&quot;'); }
function findC(id) { for(var i=0;i<CUSTOMERS.length;i++) if(CUSTOMERS[i].id===id) return CUSTOMERS[i]; return null; }
function toast(msg,t) {
  var w=document.getElementById('toasts'); if(!w) return;
  var el=document.createElement('div'); el.className='toast '+(t||'i'); el.innerHTML=msg; w.appendChild(el);
  setTimeout(function(){el.style.opacity='0';el.style.transition='opacity .3s';setTimeout(function(){if(el.parentNode)el.remove();},300);},3000);
}
function calcKom(c) {
  var satis=parseInt(c.satisFiyat)||0;
  var pct=parseFloat(c.komPct)||KOM_PCT;
  return Math.round(satis*(pct/100));
}

function loadDB() {

}

    if(c.priority==='Sicak') hot++;

  ];

  for(var k=0;k<items.length;k++) html+='<div class="stat"><div class="stat-n" style="color:'+items[k].c+'">'+items[k].v+'</div><div class="stat-l">'+items[k].l+'</div></div>';

// Smart phone search: normalize both query and phone
function phoneMatch(phone,q) {
  if(!phone||!q) return false;
  var clean=phone.split(' ').join('').split('-').join('').split('(').join('').split(')').join('');
  var qclean=q.split(' ').join('').split('-').join('');
  return clean.indexOf(qclean)>=0;
}

//    CARDS   
function getFiltered() {
  var list=[];
  for(var i=0;i<CUSTOMERS.length;i++){
    var c=CUSTOMERS[i];
    if(CUR_FILTER==='hot'){if(c.priority!=='Sicak') continue;}
    else if(CUR_FILTER==='reminder'){
      var hasR=false; for(var ri=0;ri<REMINDERS.length;ri++) if(REMINDERS[ri].custId===c.id&&!REMINDERS[ri].done){hasR=true;break;}
      if(!hasR) continue;
    }
    else if(CUR_FILTER!=='all'){if(c.status!==CUR_FILTER) continue;}
    if(CUR_SEARCH){
      var q=CUR_SEARCH;
      var nm=(c.name||'').toLowerCase(); var bl=(c.bolge||'').toLowerCase(); var nt=(c.note||'').toLowerCase(); var em=(c.email||'').toLowerCase();
      if(nm.indexOf(q)<0&&bl.indexOf(q)<0&&nt.indexOf(q)<0&&em.indexOf(q)<0&&!phoneMatch(c.phone,q)) continue;
    }
    list.push(c);
  }
  if(CUR_SORT==='newest') list.sort(function(a,b){return new Date(b.createdAt||0).getTime()-new Date(a.createdAt||0).getTime();});
  else if(CUR_SORT==='name') list.sort(function(a,b){var na=(a.name||'').toLowerCase();var nb2=(b.name||'').toLowerCase();return na<nb2?-1:na>nb2?1:0;});
  else if(CUR_SORT==='budget') list.sort(function(a,b){return (parseInt(b.bmax)||0)-(parseInt(a.bmax)||0);});
  else if(CUR_SORT==='updated') list.sort(function(a,b){return new Date(b.updatedAt||0).getTime()-new Date(a.updatedAt||0).getTime();});
  return list;
}

      html+='<button class="cbtn wa" onclick="openWaModal('+c.id+')">&#128172;</button>';

    }

    html+='</div></div>';
  }
  el.innerHTML=html;
}

  for(var i=0;i<SELECTED_IDS.length;i++){

  }
  saveDB(); document.getElementById('bulk-st-modal').classList.remove('show');
  toast(SELECTED_IDS.length+' musteri guncellendi','s');
  toggleSelectMode();

function bulkDelete(){
  if(!SELECTED_IDS.length){toast('Musteri seciniz!','w');return;}
  var cnt=SELECTED_IDS.length;
  var newList=[];
  for(var i=0;i<CUSTOMERS.length;i++){if(SELECTED_IDS.indexOf(CUSTOMERS[i].id)<0) newList.push(CUSTOMERS[i]);}

}

//    DASHBOARD   
function renderDash(){
  var el=document.getElementById('dash-area'); if(!el) return;
  var total=CUSTOMERS.length; var aktif=0,satis=0,budgetTotal=0,komTotal=0;
  var nm=thisMonth(); var buAy=0;
  for(var i=0;i<CUSTOMERS.length;i++){
    var c=CUSTOMERS[i];
    if(c.status!=='iptal'&&c.status!=='satis') aktif++;
    if(c.status==='satis'){satis++;komTotal+=calcKom(c);}
    budgetTotal+=parseInt(c.bmax)||0;
    if(c.createdAt&&c.createdAt.indexOf(nm)===0) buAy++;
  }
  var conv=total>0?Math.round((satis/total)*100):0;
  var html='';
  html+='<div class="kpi-row">';
  html+='<div class="kpi"><div class="kpi-val" style="color:var(--navy)">'+total+'</div><div class="kpi-lbl">Toplam Lead</div><div class="kpi-sub" style="color:var(--green2)">+'+buAy+' bu ay</div></div>';
  html+='<div class="kpi"><div class="kpi-val" style="color:var(--blue2)">'+aktif+'</div><div class="kpi-lbl">Aktif Lead</div></div>';
  html+='<div class="kpi"><div class="kpi-val" style="color:var(--green2)">'+satis+'</div><div class="kpi-lbl">Satis</div><div class="kpi-sub" style="color:var(--green2)">%'+conv+' donusum</div></div>';
  html+='<div class="kpi"><div class="kpi-val" style="color:var(--gold2)">'+fmtM(komTotal)+'</div><div class="kpi-lbl">Toplam Kom.</div><div class="kpi-sub" style="color:var(--gold2)">TL</div></div>';
  html+='</div>';
  // Funnel
  html+='<div class="chart-card"><div class="chart-ttl">Satis Hunisi</div>';
  var maxCnt=1;
  for(var si=0;si<STATUSES.length;si++){var cnt2=0;for(var ci2=0;ci2<CUSTOMERS.length;ci2++) if(CUSTOMERS[ci2].status===STATUSES[si].id) cnt2++;if(cnt2>maxCnt) maxCnt=cnt2;}
  for(var si2=0;si2<STATUSES.length;si2++){
    var s2=STATUSES[si2]; var cnt3=0;
    for(var ci3=0;ci3<CUSTOMERS.length;ci3++) if(CUSTOMERS[ci3].status===s2.id) cnt3++;

  }
  html+='</div>';
  // Kaynaklar
  html+='<div class="chart-card"><div class="chart-ttl">Kaynak Analizi</div>';
  var srcs={};
  for(var ci4=0;ci4<CUSTOMERS.length;ci4++){var sr=CUSTOMERS[ci4].source||'Belirtilmedi';srcs[sr]=(srcs[sr]||0)+1;}
  var srcKeys=[]; for(var sk in srcs) srcKeys.push(sk); srcKeys.sort(function(a,b){return srcs[b]-srcs[a];});
  if(!srcKeys.length) html+='<div style="font-size:12px;color:var(--text3)">Veri yok</div>';
  for(var ski=0;ski<srcKeys.length;ski++){var sk2=srcKeys[ski];var sc=srcs[sk2];var sp=total>0?Math.round((sc/total)*100):0;html+='<div class="bar-row"><div class="bar-lbl">'+safeH(sk2)+'</div><div class="bar-track"><div class="bar-fill" style="width:'+sp+'%;background:var(--purple2)"></div></div><div class="bar-cnt">'+sc+'</div></div>';}
  html+='</div>';
  // Son notlar / aktiviteler
  html+='<div class="chart-card"><div class="chart-ttl">Son Aktiviteler</div>';
  var acts=[];
  for(var ai=0;ai<CUSTOMERS.length;ai++){var ac=CUSTOMERS[ai];if(ac.notes&&ac.notes.length){var ln=ac.notes[ac.notes.length-1];acts.push({name:ac.name,text:ln.text,type:ln.type||'Not',date:ln.date,id:ac.id});}}
  acts.sort(function(a,b){return new Date(b.date||0).getTime()-new Date(a.date||0).getTime();});
  if(!acts.length) html+='<div style="color:var(--text3);font-size:12px">Henuz aktivite yok</div>';
  for(var acti=0;acti<(acts.length>8?8:acts.length);acti++){

//    CSV EXPORT   
function exportCSV(){
  var rows=['Ad,Telefon,Email,Bolge,Tip,Min Butce,Max Butce,Kaynak,Oncelik,Asama,Not,Kayit Tarihi'];
  for(var i=0;i<CUSTOMERS.length;i++){
    var c=CUSTOMERS[i];
    var cols=[c.name||'',c.phone||'',c.email||'',c.bolge||'',c.type||'',c.bmin||'',c.bmax||'',c.source||'',c.priority||'',getSt(c.status).lbl,c.note||'',c.createdAt?c.createdAt.substring(0,10):''];
    var cleaned=[]; for(var j=0;j<cols.length;j++) cleaned.push('"'+(cols[j]+'').split('"').join('""')+'"');
    rows.push(cleaned.join(','));
  }
  var csv=rows.join('\n');
  var blob=new Blob([csv],{type:'text/csv;charset=utf-8;'});
  var url=URL.createObjectURL(blob);
  var a=document.createElement('a'); a.href=url; a.download='mulk-rehberim-crm.csv'; a.click();
  URL.revokeObjectURL(url);
  toast('CSV indirildi!','s');
}

  if(!name.trim()){toast('Ad Soyad zorunlu!','e');return;}

  var gv=function(id){var e=document.getElementById(id);return e?e.value||'':'';}; var n=todayISO();

    var keys=['name','phone','email','bolge','bmin','bmax','satisFiyat','komPct','type','source','priority','note','reminder','status','updatedAt'];

//    UTILS   
function gtSH(s){ return (s||'').split('&').join('&amp;').split('<').join('&lt;').split('>').join('&gt;').split('"').join('&quot;'); }
function gtNow(){ return new Date().toISOString(); }
function gtToday(){
  var d=new Date(); var m=d.getMonth()+1;
  return d.getFullYear()+'-'+(m<10?'0'+m:''+m)+'-'+(d.getDate()<10?'0':'')+d.getDate();
}
function gtFmtDate(iso){
  if(!iso) return '';
  try{
    var d=new Date(iso+'T00:00:00'); var now=new Date();
    var td=gtToday();
    if(iso===td) return 'Bugun';
    var diff=Math.floor((new Date(iso+'T00:00:00').getTime()-new Date(td+'T00:00:00').getTime())/86400000);
    if(diff===-1) return 'Dun';
    if(diff===1) return 'Yarin';
    if(diff>1&&diff<7) return diff+' gun sonra';
    if(diff<0&&diff>-7) return (-diff)+' gun once';
    var days=['Paz','Pzt','Sal','Car','Per','Cum','Cmt'];
    return days[d.getDay()]+' '+d.getDate()+'/'+(d.getMonth()+1);
  }catch(e){return iso;}
}
function gtIsOverdue(t){ return !t.done && t.dueDate && t.dueDate < gtToday(); }
function gtFindTask(id){ for(var i=0;i<GT.tasks.length;i++) if(GT.tasks[i].id===id) return GT.tasks[i]; return null; }
function gtFindProj(id){ for(var i=0;i<GT.projects.length;i++) if(GT.projects[i].id===id) return GT.projects[i]; return null; }

function gtProjName(projId){ if(!projId) return 'Genel'; var p=gtFindProj(projId); return p?p.name:'Genel'; }

function gtGetFiltered(){
  var list=GT.tasks;
  if(GT.selProj!=='all') list=list.filter(function(t){return (t.projId||'')===(GT.selProj||'');});
  if(GT.search){ var q=GT.search.toLowerCase(); list=list.filter(function(t){return (t.title||'').toLowerCase().indexOf(q)>=0||(t.note||'').toLowerCase().indexOf(q)>=0||(t.tag||'').toLowerCase().indexOf(q)>=0;}); }
  if(GT.filterPrior!=='all') list=list.filter(function(t){return t.prior===GT.filterPrior;});

//    LIST VIEW   
function gtRenderListe(){
  var tasks=gtGetFiltered();
  if(!tasks.length) return '<div class="g-empty"><div class="g-empty-ico">&#9989;</div><div class="g-empty-ttl">Gorev yok</div><div class="g-empty-sub">Yukardaki + Gorev butonuyla yeni gorev ekle.</div></div>';

  // Group by project
  var groups={};
  for(var i=0;i<tasks.length;i++){
    var t=tasks[i]; var key=t.projId||'0';
    if(!groups[key]) groups[key]=[];
    groups[key].push(t);
  }
  // Sort within groups
  for(var gk in groups){
    groups[gk].sort(function(a,b){
      if(a.done!==b.done) return a.done?1:-1;
      var pa=PRIOR_ORDER[a.prior]||2, pb=PRIOR_ORDER[b.prior]||2;
      if(pa!==pb) return pa-pb;
      return (a.dueDate||'9999')<(b.dueDate||'9999')?-1:1;
    });
  }

  var html='';
  // Ungrouped first
  var orderedKeys=[];
  if(groups['0']) orderedKeys.push('0');
  for(var pi2=0;pi2<GT.projects.length;pi2++) if(groups[''+GT.projects[pi2].id]) orderedKeys.push(''+GT.projects[pi2].id);

  for(var oi=0;oi<orderedKeys.length;oi++){
    var gk2=orderedKeys[oi]; var gtasks=groups[gk2];
    var projId=parseInt(gk2)||0; var proj=projId?gtFindProj(projId):null;
    var pcolor=proj?proj.color:'#7a8ea8';
    var pname=proj?proj.name:'Genel';
    var isExpanded=GT.expandedGroups[gk2]!==false; // default open
    var doneCnt=0; for(var di=0;di<gtasks.length;di++) if(gtasks[di].done) doneCnt++;

    html+='<div class="g-group">';
    html+='<div class="g-group-hdr" onclick="gtToggleGroup(\''+gk2+'\')">';
    html+='<span class="g-group-arrow'+(isExpanded?' open':'')+'">&#9658;</span>';
    html+='<div style="width:8px;height:8px;border-radius:50%;background:'+pcolor+';flex-shrink:0"></div>';
    html+='<span class="g-group-name">'+gtSH(pname)+'</span>';
    html+='<span class="g-group-cnt">'+doneCnt+'/'+gtasks.length+'</span>';
    html+='<button class="g-group-add" onclick="event.stopPropagation();gtOpenTaskModalForProj('+projId+')">&#43; Ekle</button>';
    html+='</div>';

    if(isExpanded){
      html+='<div id="g-group-'+gk2+'" data-group="'+gk2+'">';
      for(var ti2=0;ti2<gtasks.length;ti2++) html+=gtBuildTaskCard(gtasks[ti2]);
      html+='<div class="g-quick-add" onclick="gtOpenTaskModalForProj('+projId+')">';
      html+='<span class="g-quick-add-ico">&#43;</span><span class="g-quick-add-txt">Gorev ekle...</span></div>';
      html+='</div>';
    }
    html+='</div>';
  }
  return html;
}

function gtBuildTaskCard(t){
  var pc=PRIOR_COLORS[t.prior||'Normal']||PRIOR_COLORS['Normal'];
  var isExp=GT.expandedTasks[t.id];
  var stTotal=t.subtasks?t.subtasks.length:0; var stDone=0;
  if(t.subtasks) for(var si=0;si<t.subtasks.length;si++) if(t.subtasks[si].done) stDone++;
  var isOD=gtIsOverdue(t);

  var html='<div class="g-task'+(t.done?' done-task':'')+'" id="gt-task-'+t.id+'" draggable="true" data-task-id="'+t.id+'" data-proj="'+(t.projId||0)+'">';
  html+='<div class="g-task-main">';
  html+='<div class="g-task-drag-handle" title="Surukle">&#8942;&#8942;</div>';
  html+='<button class="g-chk'+(t.done?' done':'')+'" onclick="gtToggleTask('+t.id+')">'+( t.done?'&#10003;':'')+'</button>';
  html+='<div class="g-task-body" onclick="gtOpenDetail('+t.id+')" style="cursor:pointer">';

  // Title + inline priority badge
  html+='<div class="g-task-title'+(t.done?' done':'')+'">';
  if(t.prior==='Acil') html+='<span style="display:inline-block;background:#fde0e0;color:#b81818;font-size:8px;font-weight:700;padding:1px 5px;border-radius:8px;margin-right:4px">ACIL</span>';
  else if(t.prior==='Yuksek') html+='<span style="display:inline-block;background:#fef4d0;color:#886000;font-size:8px;font-weight:700;padding:1px 5px;border-radius:8px;margin-right:4px">YUKSEK</span>';
  html+=gtSH(t.title||'')+'</div>';

  // Meta
  html+='<div class="g-task-meta">';
  if(t.dueDate){
    var dateStyle=isOD?'background:#fde0e0;color:#b81818':'background:var(--bg3);color:var(--text3)';
    html+='<span class="g-tag" style="'+dateStyle+'">&#128197; '+gtFmtDate(t.dueDate)+'</span>';
  }
  if(t.tag) html+='<span class="g-tag" style="background:var(--bg3);color:var(--text3)">#'+gtSH(t.tag)+'</span>';
  if(t.repeat&&t.repeat!=='Yok') html+='<span class="g-tag" style="background:var(--blue3);color:var(--blue2)">&#128260; '+gtSH(t.repeat)+'</span>';
  if(stTotal>0) html+='<span class="g-tag" style="background:var(--bg3);color:var(--text3)">&#9776; '+stDone+'/'+stTotal+'</span>';
  if(t.kbStatus&&t.kbStatus!=='todo'){
    var kb=null; for(var ki=0;ki<KB_COLS.length;ki++) if(KB_COLS[ki].id===t.kbStatus){kb=KB_COLS[ki];break;}
    if(kb) html+='<span class="g-tag" style="background:var(--bg3);color:'+kb.color+'">'+gtSH(kb.name)+'</span>';
  }
  html+='</div>';

  if(t.note&&isExp) html+='<div class="g-task-note">'+gtSH(t.note)+'</div>';
  if(stTotal>0&&isExp){
    var spct=Math.round((stDone/stTotal)*100);
    html+='<div class="g-subtask-bar"><div style="font-size:10px;color:var(--text3)">'+stDone+'/'+stTotal+' alt gorev</div>';
    html+='<div class="g-subtask-prog"><div class="g-subtask-fill" style="width:'+spct+'%"></div></div></div>';
  }
  html+='</div>';
  html+='<button class="g-task-expand" onclick="gtToggleExpand('+t.id+')">'+(isExp?'&#9650;':'&#9660;')+'</button>';
  html+='</div>';

  // Expanded subtasks
  if(isExp&&stTotal>0){
    html+='<div class="g-subtasks">';
    for(var sti=0;sti<t.subtasks.length;sti++){
      var st=t.subtasks[sti];
      html+='<div class="g-st-item">';

//    CALENDAR VIEW   
function gtRenderTakvim(){
  if(!GT.calYear){var d=new Date();GT.calYear=d.getFullYear();GT.calMonth=d.getMonth();}
  if(!GT.calSelDate) GT.calSelDate=gtToday();
  var monthNames=['Ocak','Subat','Mart','Nisan','Mayis','Haziran','Temmuz','Agustos','Eylul','Ekim','Kasim','Aralik'];
  var html='';
  html+='<div class="g-cal-nav">';
  html+='<button class="g-cal-nav-btn" onclick="gtCalPrev()">&#8249;</button>';
  html+='<div class="g-cal-month">'+monthNames[GT.calMonth]+' '+GT.calYear+'</div>';
  html+='<button class="g-cal-nav-btn" onclick="gtCalNext()">&#8250;</button>';
  html+='</div>';
  html+='<div class="g-cal-grid">';
  var dayNames=['Pt','Sa','Ca','Pe','Cu','Ct','Pz'];
  for(var dn=0;dn<7;dn++) html+='<div class="g-cal-day-name">'+dayNames[dn]+'</div>';
  var firstDay=new Date(GT.calYear,GT.calMonth,1).getDay();
  firstDay=(firstDay===0)?6:firstDay-1; // Mon=0
  var daysInMonth=new Date(GT.calYear,GT.calMonth+1,0).getDate();
  var daysInPrev=new Date(GT.calYear,GT.calMonth,0).getDate();
  var todayStr=gtToday();
  // Build day map for tasks
  var tasksByDate={};
  var filtTasks=gtGetFiltered();
  for(var ti=0;ti<filtTasks.length;ti++){
    var t=filtTasks[ti]; if(!t.dueDate) continue;
    if(!tasksByDate[t.dueDate]) tasksByDate[t.dueDate]=[];
    tasksByDate[t.dueDate].push(t);
  }
  var total=firstDay+daysInMonth; var cells=Math.ceil(total/7)*7;
  for(var c=0;c<cells;c++){
    var day,isOther=false,dateStr='';
    if(c<firstDay){day=daysInPrev-firstDay+c+1;isOther=true;var pm=GT.calMonth-1<0?11:GT.calMonth-1;var py=GT.calMonth-1<0?GT.calYear-1:GT.calYear;dateStr=py+'-'+(pm+1<10?'0':'')+(pm+1)+'-'+(day<10?'0':'')+day;}
    else if(c<firstDay+daysInMonth){day=c-firstDay+1;var m2=GT.calMonth+1;dateStr=GT.calYear+'-'+(m2<10?'0':'')+m2+'-'+(day<10?'0':'')+day;}
    else{day=c-firstDay-daysInMonth+1;isOther=true;var nm=GT.calMonth+1>11?0:GT.calMonth+1;var ny=GT.calMonth+1>11?GT.calYear+1:GT.calYear;dateStr=ny+'-'+(nm+1<10?'0':'')+(nm+1)+'-'+(day<10?'0':'')+day;}
    var isTd=dateStr===todayStr; var isSel=dateStr===GT.calSelDate;
    html+='<div class="g-cal-cell'+(isOther?' other-month':'')+(isTd?' today':'')+(isSel?' selected':'')+'" onclick="gtCalSelDate(\''+dateStr+'\')">';
    html+='<div class="g-cal-cell-num">'+day+'</div>';
    var dts=tasksByDate[dateStr]||[];
    if(dts.length>0){
      html+='<div class="g-cal-dot-row">';
      var shown=dts.length>3?3:dts.length;
      for(var di=0;di<shown;di++){
        var pc2=PRIOR_COLORS[dts[di].prior||'Normal']||PRIOR_COLORS['Normal'];
        html+='<div class="g-cal-dot" style="background:'+pc2.fg+'"></div>';
      }
      if(dts.length>3) html+='<div style="font-size:7px;color:var(--text3)">+</div>';
      html+='</div>';
    }
    html+='</div>';
  }
  html+='</div>';
  // Selected day tasks
  var selTasks=tasksByDate[GT.calSelDate]||[];
  html+='<div class="g-cal-day-tasks">';
  html+='<div class="g-cal-day-hdr">'+gtFmtDate(GT.calSelDate)+' - '+selTasks.length+' gorev';
  html+='<button onclick="gtOpenTaskModalDate(\''+GT.calSelDate+'\')" style="float:right;padding:4px 10px;background:var(--navy);border:none;border-radius:7px;color:#fff;font-size:10px;font-weight:600;cursor:pointer;-webkit-appearance:none">+ Ekle</button></div>';
  if(!selTasks.length) html+='<div style="font-size:12px;color:var(--text3);padding:12px 0">Bu gun gorev yok.</div>';
  for(var sti2=0;sti2<selTasks.length;sti2++) html+=gtBuildTaskCard(selTasks[sti2]);
  html+='</div>';
  return html;
}

//    TABLE VIEW   
function gtRenderTablo(){
  var tasks=gtGetFiltered();

    var pa=PRIOR_ORDER[a.prior]||2,pb=PRIOR_ORDER[b.prior]||2;
