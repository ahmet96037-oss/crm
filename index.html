    html+='<td>'+(proj3?'<span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:'+proj3.color+';margin-right:4px"></span>'+gtSH(proj3.name):'<span style="color:var(--text3)">-</span>')+'</td>';
    html+='<td><span class="g-tag" style="background:'+pc3.bg+';color:'+pc3.fg+'">'+gtSH(t.prior||'Normal')+'</span></td>';
    html+='<td style="color:'+(isOD2?'var(--red2)':'var(--text)')+'">'+( t.dueDate?gtFmtDate(t.dueDate):'-')+'</td>';
    var kbcol=null; for(var kci=0;kci<KB_COLS.length;kci++) if(KB_COLS[kci].id===(t.done?'done':t.kbStatus||'todo')){kbcol=KB_COLS[kci];break;}
    html+='<td>'+(kbcol?'<span class="g-tag" style="background:var(--bg3);color:'+kbcol.color+'">'+gtSH(kbcol.name)+'</span>':'-')+'</td>';
    html+='<td><button onclick="gtOpenTaskModal('+t.id+')" style="background:none;border:none;cursor:pointer;color:var(--blue2);font-size:13px;-webkit-appearance:none">&#9998;</button><button onclick="gtDeleteTask('+t.id+')" style="background:none;border:none;cursor:pointer;color:var(--red2);font-size:13px;-webkit-appearance:none">&#128465;</button></td>';
    html+='</tr>';
  }
  html+='</tbody></table></div>';
  return html;
}

//    TASK DETAIL   
function gtOpenDetail(id){
  var t=gtFindTask(id); if(!t) return;
  var proj=t.projId?gtFindProj(t.projId):null;
  var pc4=PRIOR_COLORS[t.prior||'Normal']||PRIOR_COLORS['Normal'];
  var stTotal=t.subtasks?t.subtasks.length:0; var stDone=0;
  if(t.subtasks) for(var si=0;si<t.subtasks.length;si++) if(t.subtasks[si].done) stDone++;
  var kbcol=null; for(var kci2=0;kci2<KB_COLS.length;kci2++) if(KB_COLS[kci2].id===(t.done?'done':t.kbStatus||'todo')){kbcol=KB_COLS[kci2];break;}

  var html='';
  html+='<div class="g-det-hero" style="background:'+(proj?proj.color+'18':'var(--bg3)')+'">';
  if(proj) html+='<div class="g-det-proj" style="color:'+proj.color+'">&#128203; '+gtSH(proj.name)+'</div>';
  html+='<div class="g-det-title'+(t.done?' done':'')+'">'+gtSH(t.title||'')+'</div>';
  html+='<div class="g-det-meta">';
  if(t.prior) html+='<span class="g-tag" style="background:'+pc4.bg+';color:'+pc4.fg+'">'+gtSH(t.prior)+'</span>';
  if(t.dueDate) html+='<span class="g-tag" style="background:var(--bg3);color:var(--text3)">&#128197; '+gtFmtDate(t.dueDate)+'</span>';
  if(t.tag) html+='<span class="g-tag" style="background:var(--bg3);color:var(--text3)">#'+gtSH(t.tag)+'</span>';
  if(t.repeat&&t.repeat!=='Yok') html+='<span class="g-tag" style="background:var(--blue3);color:var(--blue2)">&#128260; '+gtSH(t.repeat)+'</span>';
  if(kbcol) html+='<span class="g-tag" style="background:var(--bg3);color:'+kbcol.color+'">'+gtSH(kbcol.name)+'</span>';
  html+='</div></div>';

  // Info rows
  html+='<div class="g-det-sec">';
  html+='<div class="g-det-sec-ttl">Detaylar</div>';
  if(t.dueDate){ html+='<div class="g-det-info-row"><div class="g-det-info-lbl">Bitis Tarihi</div><div class="g-det-info-val" style="color:'+(gtIsOverdue(t)?'var(--red2)':'var(--text)')+'">'+t.dueDate+'</div></div>'; }
  if(t.startDate){ html+='<div class="g-det-info-row"><div class="g-det-info-lbl">Baslangic</div><div class="g-det-info-val">'+t.startDate+'</div></div>'; }
  if(t.time){ html+='<div class="g-det-info-row"><div class="g-det-info-lbl">Saat</div><div class="g-det-info-val">'+t.time+'</div></div>'; }
  if(t.repeat&&t.repeat!=='Yok'){ html+='<div class="g-det-info-row"><div class="g-det-info-lbl">Tekrar</div><div class="g-det-info-val">'+gtSH(t.repeat)+'</div></div>'; }
  html+='<div class="g-det-info-row"><div class="g-det-info-lbl">Olusturuldu</div><div class="g-det-info-val">'+gtFmtDate((t.createdAt||'').substring(0,10))+'</div></div>';
  html+='</div>';

  // Note
  if(t.note){
    html+='<div class="g-det-sec"><div class="g-det-sec-ttl">Not</div>';
    html+='<div class="g-note-content">'+gtSH(t.note)+'</div></div>';
  }

  // Subtasks
  if(stTotal>0){
    html+='<div class="g-det-sec"><div class="g-det-sec-ttl">Alt Gorevler ('+stDone+'/'+stTotal+')</div>';
    var spct2=Math.round((stDone/stTotal)*100);
    html+='<div style="height:5px;background:var(--bg3);border-radius:3px;overflow:hidden;margin-bottom:10px"><div style="height:100%;width:'+spct2+'%;background:var(--green2);border-radius:3px"></div></div>';
    for(var sti3=0;sti3<t.subtasks.length;sti3++){
      var st2=t.subtasks[sti3];
      html+='<div style="display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--border)">';
      html+='<button onclick="gtToggleSubtaskDet('+t.id+','+sti3+')" style="width:20px;height:20px;border-radius:6px;border:1.5px solid '+(st2.done?'var(--green2)':'var(--border2)')+';background:'+(st2.done?'var(--green2)':'var(--bg3)')+';cursor:pointer;-webkit-appearance:none;display:flex;align-items:center;justify-content:center;font-size:10px;color:#fff;flex-shrink:0">'+(st2.done?'&#10003;':'')+'</button>';
      html+='<span style="font-size:13px;flex:1;'+(st2.done?'text-decoration:line-through;color:var(--text3)':'')+'">' +gtSH(st2.text||'')+'</span></div>';
    }

  }

  // Kanban column change
  html+='<div class="g-det-sec"><div class="g-det-sec-ttl">Durum Degistir</div>';
  html+='<div style="display:flex;flex-wrap:wrap;gap:5px">';
  for(var kci3=0;kci3<KB_COLS.length;kci3++){
    var kc=KB_COLS[kci3]; var isCurKb=(t.done&&kc.id==='done')||(!t.done&&(t.kbStatus||'todo')===kc.id);
    html+='<button onclick="gtSetKbStatus('+t.id+',\''+kc.id+'\')" style="padding:6px 12px;border-radius:20px;border:1.5px solid '+kc.color+';background:'+(isCurKb?kc.color:'transparent')+';color:'+(isCurKb?'#fff':kc.color)+';font-size:10px;font-weight:700;cursor:pointer;-webkit-appearance:none">'+gtSH(kc.name)+'</button>';
  }
  html+='</div></div>';

  // Actions
  html+='<div class="g-det-actions">';
  html+='<button onclick="gtToggleTask('+t.id+');gtCloseDetail()" style="padding:11px;background:'+(t.done?'var(--bg3)':'var(--green2)')+';border:none;border-radius:10px;color:'+(t.done?'var(--text2)':'#fff')+';font-size:12px;font-weight:700;cursor:pointer;-webkit-appearance:none">'+(t.done?'&#8635; Geri Al':'&#10003; Tamamlandi')+'</button>';
  html+='<button onclick="gtCloseDetail();gtOpenTaskModal('+t.id+')" style="padding:11px;background:var(--bg3);border:none;border-radius:10px;color:var(--text2);font-size:12px;font-weight:700;cursor:pointer;-webkit-appearance:none">&#9998; Duzenle</button>';
  html+='</div>';
  html+='<div style="padding:0 16px 16px"><button onclick="gtDeleteTask('+t.id+');gtCloseDetail()" class="g-btn-del">&#128465; Kalici Sil</button></div>';
  html+='<div style="height:10px"></div>';

  document.getElementById('gt-det-body').innerHTML=html;
  document.getElementById('gt-det-modal').classList.add('show');
}
function gtCloseDetail(){ document.getElementById('gt-det-modal').classList.remove('show'); }
function gtToggleSubtaskDet(tid,idx){
  var t=gtFindTask(tid);if(!t||!t.subtasks||!t.subtasks[idx])return;
  t.subtasks[idx].done=!t.subtasks[idx].done;gtSave();gtOpenDetail(tid);
}
function gtSetKbStatus(tid,status){
  var t=gtFindTask(tid);if(!t)return;
  if(status==='done'){t.done=true;t.kbStatus='done';}
  else{t.done=false;t.kbStatus=status;}
  gtSave();gtOpenDetail(tid);gtRender();
  if(typeof playSound!=='undefined') playSound('click');
}

var GT_SEL_REPEAT='Yok';
var GT_SEL_PROJ=0;
var GT_DEF_KB='todo';
var GT_DEF_DATE='';
var GT_EDIT_TASK=0;

function gtOpenTaskModal(id){
  GT_EDIT_TASK=id; GT_SUBTASKS_TMP=[];

  GT_SEL_PRIOR=t?t.prior||'Normal':'Normal';
  GT_SEL_REPEAT=t?t.repeat||'Yok':'Yok';

function gtAddSubtask(){
  var inp=document.getElementById('gt-st-inp'); if(!inp||!inp.value.trim()) return;
  GT_SUBTASKS_TMP.push({text:inp.value.trim(),done:false}); inp.value='';
  gtRenderTaskModalSubtasks();
}
function gtSaveTask(){
  var titleEl=document.getElementById('gt-title'); var title=titleEl?titleEl.value.trim():'';
  if(!title){if(typeof toast!=='undefined')toast('Baslik zorunlu!','e');return;}
  var gv=function(id){var e=document.getElementById(id);return e?e.value||'':'';}
  var dueDate=gv('gt-due');
  if(!dueDate&&GT_DEF_DATE) dueDate=GT_DEF_DATE;
  var data={title:title,note:gv('gt-note'),dueDate:dueDate,startDate:gv('gt-start'),time:gv('gt-time'),tag:gv('gt-tag'),prior:GT_SEL_PRIOR,repeat:GT_SEL_REPEAT,projId:GT_SEL_PROJ||0,kbStatus:GT_DEF_KB,subtasks:GT_SUBTASKS_TMP.slice()};
  if(GT_EDIT_TASK){
    var t=gtFindTask(GT_EDIT_TASK); if(!t) return;
    var keys=['title','note','dueDate','startDate','time','tag','prior','repeat','projId','kbStatus','subtasks'];
    for(var k=0;k<keys.length;k++) t[keys[k]]=data[keys[k]];
    if(typeof toast!=='undefined')toast('Gorev guncellendi','s');
  } else {
    data.id=GT.nextTaskId++; data.done=false; data.createdAt=gtNow();
    GT.tasks.unshift(data);
    if(typeof toast!=='undefined')toast('Gorev eklendi!','s');
    if(typeof playSound!=='undefined') playSound('add');
  }
  // Handle repeat: schedule next if done
  gtSave(); gtCloseTaskModal(); gtRender();
}
function gtDeleteTask(id){
  var newList=[]; for(var i=0;i<GT.tasks.length;i++) if(GT.tasks[i].id!==id) newList.push(GT.tasks[i]);
  GT.tasks=newList; gtSave(); gtRender();
  if(typeof toast!=='undefined')toast('Gorev silindi','w');
  if(typeof playSound!=='undefined') playSound('delete');
}
function gtToggleTask(id){
  var t=gtFindTask(id); if(!t) return;
  t.done=!t.done;
  if(t.done&&t.repeat&&t.repeat!=='Yok'){
    var nd=new Date((t.dueDate||gtToday())+'T00:00:00');
    if(t.repeat==='Her Gun') nd.setDate(nd.getDate()+1);
    else if(t.repeat==='Her Hafta') nd.setDate(nd.getDate()+7);
    else if(t.repeat==='Her Ay') nd.setMonth(nd.getMonth()+1);
    else if(t.repeat==='Pazartesi-Cuma'){ nd.setDate(nd.getDate()+1); while(nd.getDay()===0||nd.getDay()===6) nd.setDate(nd.getDate()+1); }
    var nm=nd.getMonth()+1; var nd2=nd.getFullYear()+'-'+(nm<10?'0'+nm:''+nm)+'-'+(nd.getDate()<10?'0':'')+nd.getDate();
    var exists=false; for(var i=0;i<GT.tasks.length;i++) if(GT.tasks[i].title===t.title&&GT.tasks[i].dueDate===nd2) exists=true;
    if(!exists){ GT.tasks.push({id:GT.nextTaskId++,title:t.title,note:t.note,dueDate:nd2,startDate:t.startDate,time:t.time,tag:t.tag,prior:t.prior,repeat:t.repeat,projId:t.projId,kbStatus:'todo',subtasks:[],done:false,createdAt:gtNow()}); }
  }
  gtSave(); gtRender();
  if(t.done&&typeof playSound!=='undefined') playSound('complete');
}
function gtToggleSubtask(tid,idx){
  var t=gtFindTask(tid);if(!t||!t.subtasks||!t.subtasks[idx])return;
  t.subtasks[idx].done=!t.subtasks[idx].done;gtSave();gtRender();
}
function gtDelSubtask(tid,idx){
  var t=gtFindTask(tid);if(!t||!t.subtasks)return;
  t.subtasks.splice(idx,1);gtSave();gtRender();
}
function gtDuplicate(id){
  var t=gtFindTask(id);if(!t)return;
  var copy={id:GT.nextTaskId++,title:t.title+' (Kopya)',note:t.note,dueDate:gtToday(),startDate:t.startDate,time:t.time,tag:t.tag,prior:t.prior,repeat:'Yok',projId:t.projId,kbStatus:'todo',subtasks:t.subtasks?t.subtasks.slice():[],done:false,createdAt:gtNow()};
  GT.tasks.unshift(copy);gtSave();gtRender();
  if(typeof toast!=='undefined')toast('Kopyalandi','s');
}

//    PROJECT MODAL   
var GT_SEL_COLOR=PROJ_COLORS[0];
var GT_EDIT_PROJ=0;
function gtOpenProjModal(id){
  GT_EDIT_PROJ=id; GT_SEL_COLOR=id?gtFindProj(id).color||PROJ_COLORS[0]:PROJ_COLORS[Math.floor(Math.random()*PROJ_COLORS.length)];
  document.getElementById('gt-proj-modal-ttl').textContent=id?'Projeyi Duzenle':'Yeni Proje';

  var p=id?gtFindProj(id):null; sv('gt-proj-name',p?p.name:''); sv('gt-proj-desc',p?p.desc:'');

}
function gtRenderColorGrid(){
  var el=document.getElementById('gt-color-grid'); if(!el) return; var html='';
  for(var ci=0;ci<PROJ_COLORS.length;ci++){
    var c=PROJ_COLORS[ci]; var isOn=GT_SEL_COLOR===c;
    html+='<button class="g-color-opt'+(isOn?' on':'')+'" style="background:'+c+'" onclick="GT_SEL_COLOR=\''+c+'\';gtRenderColorGrid()"></button>';
  }
  el.innerHTML=html;
}
function gtSaveProj(){
  var nameEl=document.getElementById('gt-proj-name'); var name=nameEl?nameEl.value.trim():'';
  if(!name){if(typeof toast!=='undefined')toast('Proje adi zorunlu!','e');return;}
  var desc=(document.getElementById('gt-proj-desc')||{}).value||'';
  if(GT_EDIT_PROJ){
    var p=gtFindProj(GT_EDIT_PROJ); if(!p) return;
    p.name=name; p.desc=desc; p.color=GT_SEL_COLOR;
    if(typeof toast!=='undefined')toast('Proje guncellendi','s');
  } else {
    GT.projects.push({id:GT.nextProjId++,name:name,desc:desc,color:GT_SEL_COLOR,createdAt:gtNow()});
    if(typeof toast!=='undefined')toast(name+' projesi olusturuldu!','s');
  }
  gtSave(); gtCloseProjModal(); gtRender();
}
function gtDeleteProj(id){
  var newList=[]; for(var i=0;i<GT.projects.length;i++) if(GT.projects[i].id!==id) newList.push(GT.projects[i]);
  GT.projects=newList;
  // Unassign tasks
  for(var ti=0;ti<GT.tasks.length;ti++) if(GT.tasks[ti].projId===id) GT.tasks[ti].projId=0;
  if(GT.selProj===id) GT.selProj='all';
  gtSave(); gtCloseProjModal(); gtRender();
  if(typeof toast!=='undefined')toast('Proje silindi','w');
}
function gtCloseProjModal(){ document.getElementById('gt-proj-modal').classList.remove('show'); GT_EDIT_PROJ=0; }

//    DRAG & DROP   
function gtInitDrag(){
  var cards=document.querySelectorAll('[data-task-id]');
  for(var i=0;i<cards.length;i++){
    (function(card){
      card.addEventListener('dragstart',function(e){
        GT.dragSrcId=parseInt(card.getAttribute('data-task-id'));
        setTimeout(function(){card.classList.add('dragging');},0);
        if(e.dataTransfer) e.dataTransfer.effectAllowed='move';
      });
      card.addEventListener('dragend',function(){card.classList.remove('dragging');});
      card.addEventListener('dragover',function(e){e.preventDefault();card.classList.add('drag-over');});
      card.addEventListener('dragleave',function(){card.classList.remove('drag-over');});
      card.addEventListener('drop',function(e){
        e.preventDefault(); card.classList.remove('drag-over');
        var targetId=parseInt(card.getAttribute('data-task-id'));
        if(GT.dragSrcId&&targetId&&GT.dragSrcId!==targetId) gtSwapTasks(GT.dragSrcId,targetId);
      });
    })(cards[i]);
  }
  // KB drop zones
  var kbBodies=document.querySelectorAll('[id^="kb-body-"]');
  for(var j=0;j<kbBodies.length;j++){
    (function(body){
      var colId=body.id.replace('kb-body-','');
      body.addEventListener('dragover',function(e){e.preventDefault();});
      body.addEventListener('drop',function(e){
        e.preventDefault();
        if(GT.dragSrcId) gtSetKbStatus(GT.dragSrcId,colId);
      });
    })(kbBodies[j]);
  }
}
function gtSwapTasks(aId,bId){
  var ai=-1,bi=-1;
  for(var i=0;i<GT.tasks.length;i++){ if(GT.tasks[i].id===aId) ai=i; if(GT.tasks[i].id===bId) bi=i; }
  if(ai<0||bi<0) return;
  var tmp=GT.tasks[ai]; GT.tasks[ai]=GT.tasks[bi]; GT.tasks[bi]=tmp;
  gtSave(); gtRender();
}

function gtCalPrev(){ if(GT.calMonth===0){GT.calMonth=11;GT.calYear--;}else GT.calMonth--; gtRender(); }
function gtCalNext(){ if(GT.calMonth===11){GT.calMonth=0;GT.calYear++;}else GT.calMonth++; gtRender(); }

// ===== SES SISTEMI =====
var SND_CTX = null;
var SND_ON = true;

function initAudio() {
  try {
    if (window.AudioContext) SND_CTX = new window.AudioContext();
    else if (window.webkitAudioContext) SND_CTX = new window.webkitAudioContext();
  } catch(e) { SND_CTX = null; }
}

function resumeAudio() {
  if (SND_CTX && SND_CTX.state === 'suspended') {
    try { SND_CTX.resume(); } catch(e) {}
  }
}

function playSound(type) {
  if (!SND_ON) return;
  resumeAudio();
  if (!SND_CTX) return;
  try {
    if (type === 'complete') playSoundComplete();
    else if (type === 'add') playSoundAdd();
    else if (type === 'delete') playSoundDelete();
    else if (type === 'click') playSoundClick();
    else if (type === 'warning') playSoundWarning();
  } catch(e) {}
}

function playSoundComplete() {
  // Cheerful ascending two-tone ding
  var t = SND_CTX.currentTime;
  var osc1 = SND_CTX.createOscillator();
  var osc2 = SND_CTX.createOscillator();
  var gain1 = SND_CTX.createGain();
  var gain2 = SND_CTX.createGain();
  osc1.connect(gain1); gain1.connect(SND_CTX.destination);
  osc2.connect(gain2); gain2.connect(SND_CTX.destination);
  osc1.type = 'sine'; osc1.frequency.setValueAtTime(600, t); osc1.frequency.linearRampToValueAtTime(800, t + 0.08);
  osc2.type = 'sine'; osc2.frequency.setValueAtTime(900, t + 0.1); osc2.frequency.linearRampToValueAtTime(1100, t + 0.2);
  gain1.gain.setValueAtTime(0.18, t); gain1.gain.linearRampToValueAtTime(0, t + 0.12);
  gain2.gain.setValueAtTime(0, t + 0.08); gain2.gain.linearRampToValueAtTime(0.14, t + 0.12); gain2.gain.linearRampToValueAtTime(0, t + 0.28);
  osc1.start(t); osc1.stop(t + 0.15);
  osc2.start(t + 0.08); osc2.stop(t + 0.3);
}

function playSoundAdd() {
  // Soft pop
  var t = SND_CTX.currentTime;
  var osc = SND_CTX.createOscillator();
  var gain = SND_CTX.createGain();
  osc.connect(gain); gain.connect(SND_CTX.destination);
  osc.type = 'sine';
  osc.frequency.setValueAtTime(300, t);
  osc.frequency.exponentialRampToValueAtTime(600, t + 0.05);
  osc.frequency.exponentialRampToValueAtTime(400, t + 0.12);
  gain.gain.setValueAtTime(0.15, t);
  gain.gain.linearRampToValueAtTime(0, t + 0.15);
  osc.start(t); osc.stop(t + 0.18);
}

function playSoundDelete() {
  // Descending whoosh
  var t = SND_CTX.currentTime;
  var osc = SND_CTX.createOscillator();
  var gain = SND_CTX.createGain();
  var filter = SND_CTX.createBiquadFilter();
  osc.connect(filter); filter.connect(gain); gain.connect(SND_CTX.destination);
  filter.type = 'lowpass'; filter.frequency.setValueAtTime(2000, t); filter.frequency.linearRampToValueAtTime(200, t + 0.2);
  osc.type = 'sawtooth';
  osc.frequency.setValueAtTime(500, t);
  osc.frequency.exponentialRampToValueAtTime(80, t + 0.22);
  gain.gain.setValueAtTime(0.1, t);
  gain.gain.linearRampToValueAtTime(0, t + 0.22);
  osc.start(t); osc.stop(t + 0.25);
}

function playSoundClick() {
  // Subtle click
  var t = SND_CTX.currentTime;
  var osc = SND_CTX.createOscillator();
  var gain = SND_CTX.createGain();
  osc.connect(gain); gain.connect(SND_CTX.destination);
  osc.type = 'sine';
  osc.frequency.setValueAtTime(1000, t);
  osc.frequency.exponentialRampToValueAtTime(400, t + 0.04);
  gain.gain.setValueAtTime(0.08, t);
  gain.gain.linearRampToValueAtTime(0, t + 0.05);
  osc.start(t); osc.stop(t + 0.06);
}

function playSoundWarning() {
  // Alert tone - two short pulses
  var t = SND_CTX.currentTime;
  for (var p = 0; p < 2; p++) {
    var osc = SND_CTX.createOscillator();
    var gain = SND_CTX.createGain();
    osc.connect(gain); gain.connect(SND_CTX.destination);
    osc.type = 'triangle';
    osc.frequency.setValueAtTime(440, t + p * 0.18);
    gain.gain.setValueAtTime(0, t + p * 0.18);
    gain.gain.linearRampToValueAtTime(0.14, t + p * 0.18 + 0.01);
    gain.gain.linearRampToValueAtTime(0, t + p * 0.18 + 0.12);
    osc.start(t + p * 0.18);
    osc.stop(t + p * 0.18 + 0.15);
  }
}

function toggleSound() {
  SND_ON = !SND_ON;
  var btn = document.getElementById('snd-btn');
  if (btn) btn.textContent = SND_ON ? '&#128266;' : '&#128263;';
  toast(SND_ON ? 'Ses acik' : 'Ses kapali', 'i');
  if (SND_ON) { resumeAudio(); playSound('click'); }
}

window.onload = function() {
  initAudio();
  // iOS: AudioContext baslatmak icin ilk dokunusa ihtiyac var
  document.addEventListener('touchstart', function onFirstTouch() {
    resumeAudio();
    document.removeEventListener('touchstart', onFirstTouch);
  });
  loadDB(); addDemo(); renderAll();
};
